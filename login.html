<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Lumera – Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-cream: #faf7f2;
      --surface: #ffffff;
      --brown-deep: #3e2723;
      --brown-mid: #5d4037;
      --brown-light: #8d6e63;
      --brown-pale: #d7ccc8;
      --accent-bronze: #cd7f32;
      --accent-copper: #b87333;
      --accent-gold: #daa520;
      --text-dark: #2c1810;
      --text-body: #5c4a3d;
      --text-muted: #9e8b7d;
      --success-green: #4caf50;
      --error-red: #e53935;
      --border-light: #e8e0d8;
      --shadow-soft: 0 4px 20px rgba(62, 39, 35, 0.06);
      --shadow-medium: 0 8px 40px rgba(62, 39, 35, 0.1);
      --shadow-large: 0 20px 60px rgba(62, 39, 35, 0.15);
      --radius-small: 6px;
      --radius-medium: 12px;
      --radius-large: 20px;
      --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg-cream);
      min-height: 100vh;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle pattern overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(205, 127, 50, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(218, 165, 32, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Main Container */
    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow-large);
      padding: 40px 35px;
      position: relative;
      z-index: 1;
    }

    /* Top accent bar */
    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-bronze), var(--accent-gold));
      border-radius: 0 0 3px 3px;
    }

    /* Logo Section */
    .logo-section {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-circle {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--brown-deep), var(--brown-mid));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      position: relative;
      box-shadow: 0 4px 15px rgba(62, 39, 35, 0.3);
    }

    .logo-circle::after {
      content: '';
      position: absolute;
      inset: -4px;
      border: 2px solid var(--accent-bronze);
      border-radius: 50%;
      opacity: 0.5;
    }

    .logo-circle svg {
      width: 28px;
      height: 28px;
      color: var(--accent-gold);
    }

    .login-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--brown-deep);
      margin-bottom: 5px;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-body);
    }

    /* Form Section */
    .form-section {
      margin-top: 10px;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--brown-mid);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      transition: var(--transition-smooth);
    }

    .input-group:focus-within .input-label {
      color: var(--accent-bronze);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      transition: var(--transition-smooth);
      display: flex;
    }

    .input-group:focus-within .input-icon {
      color: var(--accent-bronze);
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
    }

    .form-control {
      width: 100%;
      height: 50px;
      background: var(--bg-cream);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-small);
      padding: 0 14px 0 44px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      transition: var(--transition-smooth);
    }

    .form-control::placeholder {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .form-control:focus {
      border-color: var(--accent-bronze);
      box-shadow: 0 0 0 3px rgba(205, 127, 50, 0.1);
      background: #ffffff;
    }

    .form-control.error {
      border-color: var(--error-red);
    }

    .form-control.success {
      border-color: var(--success-green);
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 6px;
      display: flex;
      transition: var(--transition-smooth);
    }

    .toggle-password:hover {
      color: var(--accent-bronze);
    }

    .toggle-password svg {
      width: 18px;
      height: 18px;
    }

    /* Remember me & Forgot password */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-body);
    }

    .checkbox {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-light);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .checkbox.checked {
      background: var(--accent-bronze);
      border-color: var(--accent-bronze);
    }

    .checkbox svg {
      width: 12px;
      height: 12px;
      color: white;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .checkbox.checked svg {
      opacity: 1;
    }

    .forgot-password {
      font-size: 0.85rem;
      color: var(--accent-bronze);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition-smooth);
    }

    .forgot-password:hover {
      color: var(--brown-deep);
      text-decoration: underline;
    }

    /* Submit Button */
    .submit-button {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, var(--brown-deep) 0%, var(--brown-mid) 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-small);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition-smooth);
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .submit-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s;
    }

    .submit-button:hover::before {
      left: 100%;
    }

    .submit-button:hover {
      background: linear-gradient(135deg, var(--brown-mid) 0%, var(--brown-deep) 100%);
      box-shadow: 0 8px 25px rgba(62, 39, 35, 0.3);
      transform: translateY(-2px);
    }

    .submit-button:active {
      transform: translateY(0);
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .button-spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    .form-footer {
      text-align: center;
      margin-top: 25px;
      font-size: 0.85rem;
      color: var(--text-body);
    }

    .form-footer a {
      color: var(--accent-bronze);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
      transition: var(--transition-smooth);
    }

    .form-footer a:hover {
      color: var(--brown-deep);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-light);
    }

    .divider span {
      padding: 0 15px;
    }

    /* OTP Section */
    .otp-section {
      display: none;
      margin-top: 20px;
    }

    .otp-section.show {
      display: block;
    }

    .otp-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .otp-input {
      width: 45px;
      height: 50px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      background: var(--bg-cream);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-small);
      outline: none;
      transition: var(--transition-smooth);
      font-family: inherit;
    }

    .otp-input:focus {
      border-color: var(--accent-bronze);
      box-shadow: 0 0 0 3px rgba(205, 127, 50, 0.1);
      background: #ffffff;
    }

    .resend-timer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .resend-button {
      background: none;
      border: none;
      color: var(--accent-bronze);
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      text-decoration: underline;
      transition: var(--transition-smooth);
    }

    .resend-button:hover {
      color: var(--brown-deep);
    }

    .resend-button:disabled {
      color: var(--text-muted);
      cursor: not-allowed;
      text-decoration: none;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: #ffffff;
      border-radius: var(--radius-medium);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-medium);
      transform: translateX(120%);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
      max-width: 380px;
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast.success {
      border-right: 4px solid var(--success-green);
    }

    .toast.error {
      border-right: 4px solid var(--error-red);
    }

    .toast-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toast.success .toast-icon {
      background: rgba(76, 175, 80, 0.1);
    }

    .toast.error .toast-icon {
      background: rgba(229, 57, 53, 0.1);
    }

    .toast-icon svg {
      width: 20px;
      height: 20px;
    }

    .toast.success .toast-icon svg {
      color: var(--success-green);
    }

    .toast.error .toast-icon svg {
      color: var(--error-red);
    }

    .toast-content h4 {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 2px;
    }

    .toast-content p {
      font-size: 0.8rem;
      color: var(--text-body);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 25px;
      }

      .login-title {
        font-size: 1.8rem;
      }

      .logo-circle {
        width: 50px;
        height: 50px;
      }

      .otp-input {
        width: 40px;
        height: 45px;
        font-size: 1rem;
      }

      .otp-inputs {
        gap: 8px;
      }
    }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="login-container">
  <!-- Logo Section -->
  <div class="logo-section">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1 class="login-title">Lumera</h1>
    <p class="login-subtitle">Sign in to your account</p>
  </div>

  <!-- Phone Sign In Form -->
  <div class="form-section" id="phoneForm">
    <div class="input-group">
      <label class="input-label">Phone Number</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2"/>
            <line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
        </span>
        <input type="tel" class="form-control" id="phone" placeholder="+234 800 000 0000" autocomplete="tel" />
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Password</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </span>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password" />
        <button class="toggle-password" onclick="togglePasswordVisibility()" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="form-options">
      <label class="remember-me" onclick="toggleRememberMe()">
        <div class="checkbox" id="checkbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <span>Remember me</span>
      </label>
      <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
    </div>

    <button class="submit-button" id="signInButton" onclick="handleSignIn()">
      <div class="button-spinner" id="buttonSpinner"></div>
      <span id="buttonText">Sign In</span>
    </button>
  </div>

  <!-- OTP Verification Section -->
  <div class="otp-section" id="otpSection">
    <p class="login-subtitle" style="text-align: center; margin-bottom: 20px;">
      Enter the 6-digit code sent to<br/>
      <strong id="otpPhoneDisplay">+234 800 000 0000</strong>
    </p>

    <div class="otp-inputs" id="otpInputs">
      <input type="text" class="otp-input" maxlength="1" id="otp1" />
      <input type="text" class="otp-input" maxlength="1" id="otp2" />
      <input type="text" class="otp-input" maxlength="1" id="otp3" />
      <input type="text" class="otp-input" maxlength="1" id="otp4" />
      <input type="text" class="otp-input" maxlength="1" id="otp5" />
      <input type="text" class="otp-input" maxlength="1" id="otp6" />
    </div>

    <button class="submit-button" id="verifyButton" onclick="verifyOTP()">
      <div class="button-spinner" id="verifySpinner"></div>
      <span id="verifyText">Verify & Sign In</span>
    </button>

    <div class="resend-timer">
      <span id="timerText">Resend code in 30s</span><br/>
      <button class="resend-button" id="resendButton" onclick="resendOTP()" disabled>Resend Code</button>
    </div>
  </div>

  <div class="divider">
    <span>New to Lumera?</span>
  </div>

  <p class="form-footer">
    Don't have an account?<a href="index.html">Create Account</a>
  </p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNxT46nSRdtD2cKmlqZ8ihx4Tk3QZ7Iuk",
    authDomain: "lumera-81730.firebaseapp.com",
    projectId: "lumera-81730",
    storageBucket: "lumera-81730.firebasestorage.app",
    messagingSenderId: "175198576882",
    appId: "1:175198576882:web:00367daecf932b821eb06b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Toast notification function
  function showToast(type, title, message, duration = 4000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <div class="toast-icon">
        ${type === 'success' 
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' 
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'}
      </div>
      <div class="toast-content">
        <h4>${title}</h4>
        <p>${message}</p>
      </div>
    `;
    container.appendChild(toast);
    
    requestAnimationFrame(() => {
      toast.classList.add('show');
    });
    
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 500);
    }, duration);
  }

  // Loading state management
  function setLoading(loading, buttonId, spinnerId, textId, loadingText, normalText) {
    const button = document.getElementById(buttonId);
    document.getElementById(spinnerId).style.display = loading ? 'block' : 'none';
    document.getElementById(textId).textContent = loading ? loadingText : normalText;
    button.disabled = loading;
  }

  // Toggle password visibility
  window.togglePasswordVisibility = function() {
    const input = document.getElementById('password');
    const button = input.nextElementSibling;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    
    button.innerHTML = isPassword
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
          <path d="M14.12 14.12a3 3 0 11-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>`;
  };

  // Toggle remember me
  window.toggleRememberMe = function() {
    const checkbox = document.getElementById('checkbox');
    checkbox.classList.toggle('checked');
  };

  // Get error message
  function getErrorMessage(code) {
    const errors = {
      'auth/invalid-email': 'Invalid phone number or email.',
      'auth/user-disabled': 'This account has been disabled.',
      'auth/user-not-found': 'No account found with this phone number.',
      'auth/wrong-password': 'Incorrect password. Please try again.',
      'auth/too-many-requests': 'Too many attempts. Please try again later.',
      'auth/network-request-failed': 'Network error. Please check your connection.',
      'auth/invalid-credential': 'Invalid credentials. Please check your details.',
    };
    return errors[code] || 'Sign in failed. Please try again.';
  }

  // Find user by phone number
  async function findUserByPhone(phone) {
    const usersRef = collection(db, 'users');
    const q = query(usersRef, where('phone', '==', phone));
    const querySnapshot = await getDocs(q);
    
    if (!querySnapshot.empty) {
      return querySnapshot.docs[0].data();
    }
    return null;
  }

  // Handle sign in
  window.handleSignIn = async function() {
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const cleanPhone = phone.replace(/\s/g, '');

    if (!phone) {
      showToast('error', 'Missing Field', 'Please enter your phone number.');
      return;
    }

    if (!password) {
      showToast('error', 'Missing Field', 'Please enter your password.');
      return;
    }

    if (!/^(\+234|0)?[789]\d{9}$/.test(cleanPhone)) {
      showToast('error', 'Invalid Phone', 'Please enter a valid Nigerian phone number.');
      return;
    }

    setLoading(true, 'signInButton', 'buttonSpinner', 'buttonText', 'Signing In...', 'Sign In');

    try {
      // Find user by phone number
      const userData = await findUserByPhone(cleanPhone);
      
      if (!userData) {
        setLoading(false, 'signInButton', 'buttonSpinner', 'buttonText', 'Signing In...', 'Sign In');
        showToast('error', 'Account Not Found', 'No account found with this phone number.');
        return;
      }

      // Sign in with email and password
      await signInWithEmailAndPassword(auth, userData.email, password);
      
      setLoading(false, 'signInButton', 'buttonSpinner', 'buttonText', 'Signing In...', 'Sign In');
      showToast('success', 'Welcome Back! 🎉', 'Successfully signed in. Redirecting...');
      
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);

    } catch (error) {
      setLoading(false, 'signInButton', 'buttonSpinner', 'buttonText', 'Signing In...', 'Sign In');
      showToast('error', 'Sign In Failed', getErrorMessage(error.code));
    }
  };

  // OTP Verification functions
  window.verifyOTP = function() {
    const otp = [];
    for (let i = 1; i <= 6; i++) {
      otp.push(document.getElementById('otp' + i).value);
    }
    
    const otpCode = otp.join('');
    
    if (otpCode.length !== 6) {
      showToast('error', 'Invalid Code', 'Please enter the complete 6-digit code.');
      return;
    }
    
    // For demo purposes, accept any 6-digit code
    showToast('success', 'Verification Successful', 'Phone number verified successfully!');
    
    setLoading(true, 'verifyButton', 'verifySpinner', 'verifyText', 'Verifying...', 'Verify & Sign In');
    
    setTimeout(() => {
      setLoading(false, 'verifyButton', 'verifySpinner', 'verifyText', 'Verifying...', 'Verify & Sign In');
      window.location.href = 'dashboard.html';
    }, 2000);
  };

  window.resendOTP = function() {
    const button = document.getElementById('resendButton');
    button.disabled = true;
    
    let timer = 30;
    const timerText = document.getElementById('timerText');
    
    const interval = setInterval(() => {
      timer--;
      timerText.textContent = `Resend code in ${timer}s`;
      
      if (timer <= 0) {
        clearInterval(interval);
        timerText.textContent = 'Code sent successfully!';
        button.disabled = false;
      }
    }, 1000);
    
    showToast('success', 'Code Sent', 'New verification code sent to your phone.');
  };

  // OTP input navigation
  document.addEventListener('DOMContentLoaded', () => {
    const otpInputs = document.querySelectorAll('.otp-input');
    
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });
    });
    
    // Enter key to submit
    document.getElementById('phone').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSignIn();
    });
    
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSignIn();
    });
  });
</script>

</body>
</html>
