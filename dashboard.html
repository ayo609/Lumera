<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Lumera – Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-cream: #faf7f2;
      --surface: #ffffff;
      --brown-deep: #3e2723;
      --brown-mid: #5d4037;
      --brown-light: #8d6e63;
      --brown-pale: #d7ccc8;
      --accent-bronze: #cd7f32;
      --accent-gold: #daa520;
      --text-dark: #2c1810;
      --text-body: #5c4a3d;
      --text-muted: #9e8b7d;
      --success-green: #4caf50;
      --error-red: #e53935;
      --border-light: #e8e0d8;
      --shadow-soft: 0 4px 20px rgba(62, 39, 35, 0.06);
      --shadow-medium: 0 8px 40px rgba(62, 39, 35, 0.1);
      --radius-small: 6px;
      --radius-medium: 12px;
      --radius-large: 20px;
      --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg-cream);
      min-height: 100vh;
      color: var(--text-dark);
      position: relative;
      overflow-x: hidden;
    }

    /* Hamburger */
    .hamburger {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: var(--brown-deep);
      border: none;
      width: 45px;
      height: 45px;
      border-radius: var(--radius-small);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: var(--transition-smooth);
      box-shadow: var(--shadow-medium);
    }

    .hamburger:hover {
      background: var(--brown-mid);
      transform: scale(1.05);
    }

    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: #ffffff;
      border-radius: 2px;
      transition: var(--transition-smooth);
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* Sidebar */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .sidebar-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      background: var(--surface);
      z-index: 999;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-large);
      display: flex;
      flex-direction: column;
      padding: 80px 0 20px;
      overflow-y: auto;
    }

    .sidebar.show {
      left: 0;
    }

    .sidebar-nav {
      list-style: none;
      padding: 0 15px;
      flex: 1;
    }

    .sidebar-nav li {
      margin-bottom: 5px;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      color: var(--text-body);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-small);
      transition: var(--transition-smooth);
    }

    .sidebar-nav a:hover,
    .sidebar-nav a.active {
      background: var(--brown-soft);
      color: var(--brown-deep);
    }

    .sidebar-nav a svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .sidebar-logout {
      margin: 20px 15px 0;
      padding: 12px 15px;
      background: var(--error-red);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-small);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition-smooth);
    }

    .sidebar-logout:hover {
      background: #c62828;
    }

    .sidebar-logout svg {
      width: 18px;
      height: 18px;
    }

    /* Main Content */
    .main-content {
      margin-left: 0;
      padding: 80px 20px 20px;
      transition: margin-left 0.3s;
    }

    /* Image Slider */
    .image-slider {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto 20px;
      border-radius: var(--radius-large);
      overflow: hidden;
      box-shadow: var(--shadow-medium);
      height: 200px;
      background: var(--brown-soft);
    }

    .slider-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .slider-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .slider-image.active {
      opacity: 1;
    }

    .slider-dots {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .slider-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .slider-dot.active {
      background: var(--accent-gold);
      width: 20px;
      border-radius: 4px;
    }

    /* Live Coins Ticker */
    .coins-ticker {
      background: var(--surface);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow-soft);
      padding: 15px;
      margin-bottom: 20px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .ticker-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--brown-deep);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ticker-title svg {
      width: 20px;
      height: 20px;
      color: var(--accent-bronze);
    }

    .coins-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
    }

    .coin-item {
      background: var(--bg-cream);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-small);
      padding: 12px 8px;
      text-align: center;
      transition: var(--transition-smooth);
      cursor: pointer;
    }

    .coin-item:hover {
      border-color: var(--accent-bronze);
      box-shadow: 0 4px 12px rgba(205, 127, 50, 0.15);
      transform: translateY(-2px);
    }

    .coin-symbol {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--brown-deep);
      margin-bottom: 4px;
    }

    .coin-price {
      font-size: 0.75rem;
      color: var(--text-body);
      font-weight: 600;
    }

    .coin-change {
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .coin-change.positive {
      color: var(--success-green);
    }

    .coin-change.negative {
      color: var(--error-red);
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto 20px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius-medium);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, var(--accent-bronze), var(--accent-gold));
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: 'DM Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brown-deep);
    }

    /* Dashboard Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .dashboard-card {
      background: var(--surface);
      border-radius: var(--radius-large);
      padding: 25px;
      box-shadow: var(--shadow-soft);
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--brown-deep);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title svg {
      width: 20px;
      height: 20px;
      color: var(--accent-bronze);
    }

    /* Action Buttons */
    .action-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .action-btn {
      padding: 15px;
      border: none;
      border-radius: var(--radius-small);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition-smooth);
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-deposit {
      background: var(--brown-deep);
      color: #ffffff;
    }

    .btn-deposit:hover {
      background: var(--brown-mid);
      box-shadow: 0 4px 15px rgba(62, 39, 35, 0.3);
    }

    .btn-invest {
      background: linear-gradient(135deg, var(--accent-bronze), var(--accent-gold));
      color: #ffffff;
    }

    .btn-invest:hover {
      box-shadow: 0 4px 15px rgba(205, 127, 50, 0.4);
      transform: translateY(-2px);
    }

    .btn-withdraw {
      background: var(--brown-light);
      color: #ffffff;
    }

    .btn-withdraw:hover {
      background: var(--brown-mid);
      box-shadow: 0 4px 15px rgba(62, 39, 35, 0.3);
    }

    .btn-refer {
      background: var(--success-green);
      color: #ffffff;
    }

    .btn-refer:hover {
      background: #388e3c;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .coins-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      .coins-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .image-slider {
        height: 150px;
      }
      .main-content {
        padding: 70px 10px 10px;
      }
    }
  </style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNxT46nSRdtD2cKmlqZ8ihx4Tk3QZ7Iuk",
    authDomain: "lumera-81730.firebaseapp.com",
    projectId: "lumera-81730",
    storageBucket: "lumera-81730.firebasestorage.app",
    messagingSenderId: "175198576882",
    appId: "1:175198576882:web:00367daecf932b821eb06b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  // ===== SIDEBAR TOGGLE =====
  window.toggleSidebar = function() {
    document.getElementById('sidebar').classList.toggle('show');
    document.getElementById('sidebarOverlay').classList.toggle('show');
    document.getElementById('hamburgerBtn').classList.toggle('active');
  };

  // ===== IMAGE SLIDER =====
  let currentSlide = 0;
  window.changeSlide = function(index) {
    currentSlide = index;
    const slides = document.querySelectorAll('.slider-image');
    const dots = document.querySelectorAll('.slider-dot');
    
    slides.forEach((slide, i) => {
      slide.classList.remove('active');
      if (i === index) slide.classList.add('active');
    });
    
    dots.forEach((dot, i) => {
      dot.classList.remove('active');
      if (i === index) dot.classList.add('active');
    });
  };

  // Auto slide
  setInterval(() => {
    currentSlide = currentSlide === 0 ? 1 : 0;
    changeSlide(currentSlide);
  }, 5000);

  // ===== LIVE COINS DATA =====
  const coinsList = [
    { symbol: 'BTC', name: 'Bitcoin' },
    { symbol: 'SOL', name: 'Solana' },
    { symbol: 'TON', name: 'Toncoin' },
    { symbol: 'ETH', name: 'Ethereum' },
    { symbol: 'BNB', name: 'Binance Coin' },
    { symbol: 'XRP', name: 'Ripple' },
    { symbol: 'ADA', name: 'Cardano' },
    { symbol: 'DOGE', name: 'Dogecoin' },
    { symbol: 'AVAX', name: 'Avalanche' },
    { symbol: 'MATIC', name: 'Polygon' }
  ];

  function loadCoins() {
    const grid = document.getElementById('coinsGrid');
    grid.innerHTML = '';
    
    coinsList.forEach(coin => {
      const coinItem = document.createElement('div');
      coinItem.className = 'coin-item';
      coinItem.innerHTML = `
        <div class="coin-symbol">${coin.symbol}</div>
        <div class="coin-price">Loading...</div>
        <div class="coin-change">--</div>
      `;
      grid.appendChild(coinItem);
      
      fetchCoinPrice(coin.symbol, coinItem);
    });
  }

  async function fetchCoinPrice(symbol, element) {
    try {
      const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${getCoinId(symbol)}&vs_currencies=usd&include_24hr_change=true`);
      const data = await response.json();
      const coinId = getCoinId(symbol);
      
      if (data[coinId]) {
        const price = data[coinId].usd;
        const change = data[coinId].usd_24h_change;
        
        element.querySelector('.coin-price').textContent = `$${price.toFixed(2)}`;
        const changeEl = element.querySelector('.coin-change');
        changeEl.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
        changeEl.className = `coin-change ${change >= 0 ? 'positive' : 'negative'}`;
      }
    } catch (error) {
      element.querySelector('.coin-price').textContent = '--';
      element.querySelector('.coin-change').textContent = '--';
    }
  }

  function getCoinId(symbol) {
    const map = {
      'BTC': 'bitcoin',
      'SOL': 'solana',
      'TON': 'the-open-network',
      'ETH': 'ethereum',
      'BNB': 'binancecoin',
      'XRP': 'ripple',
      'ADA': 'cardano',
      'DOGE': 'dogecoin',
      'AVAX': 'avalanche-2',
      'MATIC': 'matic-network'
    };
    return map[symbol] || symbol.toLowerCase();
  }

  // ===== LOAD USER DATA =====
  async function loadUserData() {
    if (!currentUser) return;
    
    try {
      const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
      if (userDoc.exists()) {
        const data = userDoc.data();
        document.getElementById('depositWallet').textContent = `$${(data.depositWallet || 0).toFixed(2)}`;
        document.getElementById('withdrawalWallet').textContent = `$${(data.withdrawalWallet || 0).toFixed(2)}`;
        document.getElementById('activeInvestments').textContent = `$${(data.activeInvestments || 0).toFixed(2)}`;
        document.getElementById('referralEarnings').textContent = `$${(data.referralEarnings || 0).toFixed(2)}`;
      }
    } catch (error) {
      console.error('Error loading user data:', error);
    }
  }

  // ===== LOGOUT =====
  window.logout = function() {
    if (confirm('Are you sure you want to sign out?')) {
      auth.signOut().then(() => {
        window.location.href = 'login.html';
      });
    }
  };

  // ===== AUTH STATE =====
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      loadCoins();
      loadUserData();
    } else {
      window.location.href = 'login.html';
    }
  });
</script>

</body>
</html>
