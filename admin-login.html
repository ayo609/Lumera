<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Lumera – Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #1a1a2e;
      --bg-darker: #16213e;
      --surface: #0f3460;
      --surface-light: #1a1a40;
      --gold: #e94560;
      --gold-light: #ff6b6b;
      --text-light: #ffffff;
      --text-muted: #a0a0b8;
      --border-light: rgba(255,255,255,0.1);
      --shadow-soft: 0 8px 32px rgba(0,0,0,0.3);
      --shadow-medium: 0 12px 40px rgba(0,0,0,0.5);
      --radius-small: 8px;
      --radius-medium: 14px;
      --radius-large: 24px;
      --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Background */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(233,69,96,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(15,52,96,0.3) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(22,33,62,0.2) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid Pattern */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Login Container */
    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: var(--radius-large);
      padding: 40px 35px;
      position: relative;
      z-index: 1;
      box-shadow: var(--shadow-medium);
      border: 1px solid var(--border-light);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top Accent */
    .login-container::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 80px; height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 0 0 3px 3px;
    }

    /* Logo */
    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo-badge {
      width: 70px; height: 70px;
      margin: 0 auto 15px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(233,69,96,0.4);
      position: relative;
    }
    .logo-badge::after {
      content: '';
      position: absolute;
      inset: -3px;
      border: 2px solid rgba(233,69,96,0.3);
      border-radius: 22px;
      animation: pulse-ring 2s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.5; }
    }
    .logo-badge svg {
      width: 32px; height: 32px;
      color: #fff;
    }
    .admin-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .admin-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
      position: relative;
    }
    .form-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 7px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      transition: var(--transition-smooth);
    }
    .input-icon svg {
      width: 18px; height: 18px;
    }
    .form-control {
      width: 100%;
      height: 50px;
      background: var(--surface-light);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-small);
      padding: 0 14px 0 44px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-light);
      outline: none;
      transition: var(--transition-smooth);
    }
    .form-control::placeholder {
      color: rgba(255,255,255,0.3);
      font-size: 0.85rem;
    }
    .form-control:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(233,69,96,0.15);
      background: var(--bg-darker);
    }
    .form-control.error {
      border-color: #ff4444;
    }
    .form-group:focus-within .input-icon {
      color: var(--gold);
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 6px;
      display: flex;
      transition: var(--transition-smooth);
    }
    .toggle-password:hover {
      color: var(--gold);
    }
    .toggle-password svg {
      width: 18px; height: 18px;
    }

    /* Remember & Forgot */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .checkbox {
      width: 18px; height: 18px;
      border: 2px solid var(--border-light);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }
    .checkbox.checked {
      background: var(--gold);
      border-color: var(--gold);
    }
    .checkbox svg {
      width: 11px; height: 11px;
      color: #fff;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .checkbox.checked svg {
      opacity: 1;
    }
    .forgot-link {
      font-size: 0.8rem;
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition-smooth);
    }
    .forgot-link:hover {
      color: var(--gold-light);
      text-decoration: underline;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-small);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition-smooth);
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }
    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s;
    }
    .submit-btn:hover::before {
      left: 100%;
    }
    .submit-btn:hover {
      box-shadow: 0 8px 30px rgba(233,69,96,0.5);
      transform: translateY(-2px);
    }
    .submit-btn:active {
      transform: translateY(0);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .button-spinner {
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error Message */
    .error-message {
      display: none;
      background: rgba(255,68,68,0.1);
      border: 1px solid #ff4444;
      border-radius: var(--radius-small);
      padding: 12px 15px;
      margin-bottom: 15px;
      font-size: 0.8rem;
      color: #ff4444;
      text-align: center;
      animation: shake 0.5s;
    }
    .error-message.show {
      display: block;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* Back Link */
    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .back-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition-smooth);
    }
    .back-link a:hover {
      color: var(--gold-light);
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: var(--surface);
      border-radius: var(--radius-medium);
      padding: 14px 18px;
      box-shadow: var(--shadow-medium);
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateX(120%);
      transition: transform 0.5s;
      max-width: 340px;
      border-left: 4px solid var(--gold);
    }
    .toast.show { transform: translateX(0); }
    .toast.success { border-left-color: #4caf50; }
    .toast.error { border-left-color: #ff4444; }
    .toast-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .toast.success .toast-icon { background: rgba(76,175,80,0.15); color: #4caf50; }
    .toast.error .toast-icon { background: rgba(255,68,68,0.15); color: #ff4444; }
    .toast-icon svg { width: 16px; height: 16px; }
    .toast-content h4 { font-size: 0.85rem; font-weight: 700; color: var(--text-light); margin-bottom: 2px; }
    .toast-content p { font-size: 0.75rem; color: var(--text-muted); }

    @media (max-width: 480px) {
      .login-container { padding: 30px 25px; }
      .admin-title { font-size: 1.5rem; }
      .logo-badge { width: 60px; height: 60px; }
      .logo-badge svg { width: 26px; height: 26px; }
    }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="login-container">
  
  <!-- Logo Section -->
  <div class="logo-section">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1 class="admin-title">Lumera Admin</h1>
    <p class="admin-subtitle">Management Panel</p>
  </div>

  <!-- Error Message -->
  <div class="error-message" id="errorMessage">
    Invalid credentials. Access denied.
  </div>

  <!-- Login Form -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">Admin Email</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
        </span>
        <input type="email" class="form-control" id="email" placeholder="admin@lumera.com" autocomplete="email" required />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </span>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password" required />
        <button class="toggle-password" type="button" onclick="togglePassword()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="form-options">
      <label class="remember-me" onclick="toggleRemember()">
        <div class="checkbox" id="checkbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span>Remember me</span>
      </label>
      <a href="#" class="forgot-link" onclick="showToast('info','Password Reset','Contact super admin for password reset.')">Forgot password?</a>
    </div>

    <button class="submit-btn" id="loginBtn" type="submit">
      <div class="button-spinner" id="spinner"></div>
      <span id="btnText">Sign In</span>
    </button>
  </form>

  <p class="back-link">
    <a href="index.html">&larr; Back to Main Site</a>
  </p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNxT46nSRdtD2cKmlqZ8ihx4Tk3QZ7Iuk",
    authDomain: "lumera-81730.firebaseapp.com",
    projectId: "lumera-81730",
    storageBucket: "lumera-81730.firebasestorage.app",
    messagingSenderId: "175198576882",
    appId: "1:175198576882:web:00367daecf932b821eb06b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ===== TOAST =====
  function showToast(type, title, message) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <div class="toast-icon">
        ${type === 'success' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : 
          type === 'error' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' : 
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'}
      </div>
      <div class="toast-content"><h4>${title}</h4><p>${message}</p></div>
    `;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 4000);
  }

  // ===== TOGGLE PASSWORD =====
  window.togglePassword = function() {
    const input = document.getElementById('password');
    const button = input.nextElementSibling;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    button.innerHTML = isPassword
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><path d="M14.12 14.12a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  };

  // ===== TOGGLE REMEMBER =====
  window.toggleRemember = function() {
    document.getElementById('checkbox').classList.toggle('checked');
  };

  // ===== HANDLE LOGIN =====
  window.handleLogin = async function(event) {
    event.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('errorMessage');
    const loginBtn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');

    if (!email || !password) {
      errorEl.textContent = 'Please enter email and password.';
      errorEl.classList.add('show');
      setTimeout(() => errorEl.classList.remove('show'), 3000);
      return;
    }

    loginBtn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = 'Signing In...';
    errorEl.classList.remove('show');

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Check if user is admin
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      
      if (userDoc.exists() && userDoc.data().isAdmin === true) {
        showToast('success', 'Welcome Admin!', 'Login successful. Redirecting...');
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 1500);
      } else {
        // Not an admin
        await auth.signOut();
        errorEl.textContent = 'Access denied. This account is not an admin.';
        errorEl.classList.add('show');
        loginBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Sign In';
        showToast('error', 'Access Denied', 'This account does not have admin privileges.');
      }

    } catch (error) {
      loginBtn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = 'Sign In';
      
      const errorMessages = {
        'auth/invalid-email': 'Invalid email address.',
        'auth/user-disabled': 'This account has been disabled.',
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password. Please try again.',
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/too-many-requests': 'Too many attempts. Please try again later.',
        'auth/network-request-failed': 'Network error. Check your connection.'
      };
      
      errorEl.textContent = errorMessages[error.code] || 'Login failed. Please try again.';
      errorEl.classList.add('show');
      setTimeout(() => errorEl.classList.remove('show'), 4000);
    }
  };

  // ===== CHECK IF ALREADY LOGGED IN =====
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      try {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (userDoc.exists() && userDoc.data().isAdmin === true) {
          window.location.href = 'admin-dashboard.html';
        }
      } catch (error) {
        console.error('Auth check error:', error);
      }
    }
  });
</script>

</body>
</html>
