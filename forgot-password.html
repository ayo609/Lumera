<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Lumera – Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-cream: #faf7f2; --surface: #ffffff;
      --brown-deep: #3e2723; --brown-mid: #5d4037;
      --brown-light: #8d6e63; --brown-pale: #d7ccc8; --brown-soft: #f5f0eb;
      --accent-bronze: #cd7f32; --accent-gold: #daa520;
      --text-dark: #2c1810; --text-body: #5c4a3d; --text-muted: #9e8b7d;
      --success-green: #4caf50; --error-red: #e53935;
      --border-light: #e8e0d8;
      --shadow-soft: 0 4px 20px rgba(62, 39, 35, 0.06);
      --shadow-medium: 0 8px 40px rgba(62, 39, 35, 0.1);
      --shadow-large: 0 20px 60px rgba(62, 39, 35, 0.15);
      --radius-small: 6px; --radius-medium: 12px; --radius-large: 20px;
      --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body { font-family: 'Manrope', system-ui, sans-serif; background: var(--bg-cream); min-height: 100vh; color: var(--text-dark); display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow-x: hidden; }

    body::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(205, 127, 50, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(218, 165, 32, 0.05) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }

    .container { width: 100%; max-width: 440px; background: var(--surface); border-radius: var(--radius-large); box-shadow: var(--shadow-large); padding: 40px 35px; position: relative; z-index: 1; }
    .container::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 3px; background: linear-gradient(90deg, var(--accent-bronze), var(--accent-gold)); border-radius: 0 0 3px 3px; }

    .logo-section { text-align: center; margin-bottom: 30px; }
    .logo-circle { width: 60px; height: 60px; background: linear-gradient(135deg, var(--brown-deep), var(--brown-mid)); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; position: relative; box-shadow: 0 4px 15px rgba(62, 39, 35, 0.3); }
    .logo-circle::after { content: ''; position: absolute; inset: -4px; border: 2px solid var(--accent-bronze); border-radius: 50%; opacity: 0.5; }
    .logo-circle svg { width: 28px; height: 28px; color: var(--accent-gold); }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 700; color: var(--brown-deep); margin-bottom: 5px; }
    .page-subtitle { font-size: 0.85rem; color: var(--text-body); }

    .info-banner { background: #fff8f0; border: 1px solid var(--accent-bronze); border-radius: var(--radius-small); padding: 12px 15px; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 10px; font-size: 0.8rem; color: var(--text-body); line-height: 1.5; }
    .info-banner svg { width: 18px; height: 18px; color: var(--accent-bronze); flex-shrink: 0; margin-top: 2px; }

    .error-msg { display: none; background: rgba(229,57,53,0.08); border: 1px solid var(--error-red); border-radius: var(--radius-small); padding: 12px 15px; font-size: 0.8rem; color: var(--error-red); margin-bottom: 15px; text-align: center; }

    .success-msg { display: none; background: rgba(76,175,80,0.08); border: 1px solid var(--success-green); border-radius: var(--radius-small); padding: 12px 15px; font-size: 0.8rem; color: var(--success-green); margin-bottom: 15px; text-align: center; }

    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--brown-mid); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 14px; color: var(--text-muted); pointer-events: none; display: flex; }
    .input-icon svg { width: 18px; height: 18px; }
    .form-control { width: 100%; height: 50px; background: var(--bg-cream); border: 1.5px solid var(--border-light); border-radius: var(--radius-small); padding: 0 14px 0 44px; font-family: inherit; font-size: 0.9rem; color: var(--text-dark); outline: none; transition: var(--transition-smooth); }
    .form-control::placeholder { color: var(--text-muted); font-size: 0.85rem; }
    .form-control:focus { border-color: var(--accent-bronze); box-shadow: 0 0 0 3px rgba(205, 127, 50, 0.1); background: #fff; }
    .form-control.error { border-color: var(--error-red); }

    .submit-btn { width: 100%; height: 52px; background: linear-gradient(135deg, var(--brown-deep), var(--brown-mid)); color: #fff; font-family: inherit; font-size: 1rem; font-weight: 700; border: none; border-radius: var(--radius-small); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: var(--transition-smooth); letter-spacing: 0.5px; position: relative; overflow: hidden; }
    .submit-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transition: left 0.5s; }
    .submit-btn:hover::before { left: 100%; }
    .submit-btn:hover { box-shadow: 0 8px 25px rgba(62,39,35,0.3); transform: translateY(-2px); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .button-spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-body); }
    .back-link a { color: var(--accent-bronze); font-weight: 700; text-decoration: none; margin-left: 4px; }
    .back-link a:hover { color: var(--brown-deep); text-decoration: underline; }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: #fff; border-radius: var(--radius-medium); padding: 16px 20px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-medium); transform: translateX(120%); transition: transform 0.5s; pointer-events: auto; max-width: 350px; }
    .toast.show { transform: translateX(0); }
    .toast.success { border-right: 4px solid var(--success-green); }
    .toast.error { border-right: 4px solid var(--error-red); }
    .toast-icon { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast.success .toast-icon { background: rgba(76,175,80,0.1); color: var(--success-green); }
    .toast.error .toast-icon { background: rgba(229,57,53,0.1); color: var(--error-red); }
    .toast-icon svg { width: 18px; height: 18px; }
    .toast-content h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; }
    .toast-content p { font-size: 0.8rem; color: var(--text-body); }

    @media (max-width: 480px) { .container { padding: 30px 25px; } .page-title { font-size: 1.5rem; } }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="container">
  <div class="logo-section">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <h1 class="page-title">Forgot Password</h1>
    <p class="page-subtitle">Enter your email to reset your password</p>
  </div>

  <div class="info-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <div>Enter the email address associated with your Lumera account. We'll send you a password reset link.</div>
  </div>

  <div class="error-msg" id="errorMsg">Please enter a valid email address.</div>
  <div class="success-msg" id="successMsg">Password reset link has been sent! Check your email inbox.</div>

  <div class="form-group">
    <label class="form-label">Email Address</label>
    <div class="input-wrapper">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
      </span>
      <input type="email" class="form-control" id="emailInput" placeholder="your@email.com" autocomplete="email" />
    </div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="handleResetPassword()">
    <div class="button-spinner" id="spinner"></div>
    <span id="btnText">Send Reset Link</span>
  </button>

  <p class="back-link">
    Remembered your password?<a href="login.html">Sign In</a>
  </p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNxT46nSRdtD2cKmlqZ8ihx4Tk3QZ7Iuk",
    authDomain: "lumera-81730.firebaseapp.com",
    projectId: "lumera-81730",
    storageBucket: "lumera-81730.firebasestorage.app",
    messagingSenderId: "175198576882",
    appId: "1:175198576882:web:00367daecf932b821eb06b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  function showToast(type, title, message) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <div class="toast-icon">
        ${type === 'success' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'}
      </div>
      <div class="toast-content"><h4>${title}</h4><p>${message}</p></div>
    `;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 4000);
  }

  function showError(message) {
    document.getElementById('errorMsg').textContent = message;
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
    setTimeout(() => { document.getElementById('errorMsg').style.display = 'none'; }, 5000);
  }

  function showSuccess(message) {
    document.getElementById('successMsg').textContent = message;
    document.getElementById('successMsg').style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
  }

  window.handleResetPassword = async function() {
    const email = document.getElementById('emailInput').value.trim();
    
    if (!email) {
      showError('Please enter your email address.');
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('Please enter a valid email address.');
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');

    submitBtn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = 'Sending...';

    try {
      await sendPasswordResetEmail(auth, email, {
        url: 'https://lumera-81730.firebaseapp.com/login.html',
        handleCodeInApp: false
      });
      
      spinner.style.display = 'none';
      btnText.textContent = 'Send Reset Link';
      
      showSuccess('Password reset link has been sent! Check your email inbox.');
      showToast('success', 'Email Sent!', 'Password reset link sent to ' + email);
      
      document.getElementById('emailInput').value = '';
      
      // Keep button enabled for resending
      submitBtn.disabled = false;
      
    } catch (error) {
      console.error('Reset password error:', error);
      spinner.style.display = 'none';
      submitBtn.disabled = false;
      btnText.textContent = 'Send Reset Link';
      
      const errorMessages = {
        'auth/user-not-found': 'No account found with this email address.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/too-many-requests': 'Too many requests. Please try again later.',
        'auth/network-request-failed': 'Network error. Please check your connection.'
      };
      
      showError(errorMessages[error.code] || 'Failed to send reset link. Please try again.');
      showToast('error', 'Error', errorMessages[error.code] || 'Failed to send reset link.');
    }
  };

  // Enter key to submit
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('emailInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleResetPassword();
    });
  });
</script>

</body>
</html>
