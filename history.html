<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Lumera – History</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-cream: #faf7f2;
      --surface: #ffffff;
      --brown-deep: #3e2723;
      --brown-mid: #5d4037;
      --brown-light: #8d6e63;
      --brown-pale: #d7ccc8;
      --brown-soft: #f5f0eb;
      --accent-bronze: #cd7f32;
      --accent-gold: #daa520;
      --text-dark: #2c1810;
      --text-body: #5c4a3d;
      --text-muted: #9e8b7d;
      --success-green: #4caf50;
      --error-red: #e53935;
      --border-light: #e8e0d8;
      --shadow-soft: 0 4px 20px rgba(62, 39, 35, 0.06);
      --shadow-medium: 0 8px 40px rgba(62, 39, 35, 0.1);
      --radius-small: 6px;
      --radius-medium: 12px;
      --radius-large: 20px;
      --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg-cream);
      min-height: 100vh;
      color: var(--text-dark);
      position: relative;
      overflow-x: hidden;
    }

    /* Hamburger */
    .hamburger {
      position: fixed; top: 20px; left: 20px; z-index: 1000;
      background: var(--brown-deep); border: none;
      width: 45px; height: 45px; border-radius: var(--radius-small);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
      box-shadow: var(--shadow-medium);
    }
    .hamburger span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; }

    /* Sidebar */
    .sidebar-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 998;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .sidebar-overlay.show { opacity: 1; pointer-events: auto; }
    .sidebar {
      position: fixed; top: 0; left: -280px; width: 280px; height: 100vh;
      background: var(--surface); z-index: 999;
      transition: left 0.3s; box-shadow: var(--shadow-large);
      display: flex; flex-direction: column; padding: 80px 0 20px; overflow-y: auto;
    }
    .sidebar.show { left: 0; }
    .sidebar-nav { list-style: none; padding: 0 15px; flex: 1; }
    .sidebar-nav li { margin-bottom: 5px; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 12px; padding: 12px 15px;
      color: var(--text-body); text-decoration: none;
      font-size: 0.9rem; font-weight: 600; border-radius: var(--radius-small);
      transition: var(--transition-smooth);
    }
    .sidebar-nav a:hover, .sidebar-nav a.active { background: var(--brown-soft); color: var(--brown-deep); }
    .sidebar-nav a svg { width: 18px; height: 18px; }
    .sidebar-logout {
      margin: 20px 15px 0; padding: 12px 15px;
      background: var(--error-red); color: #fff; border: none;
      border-radius: var(--radius-small); cursor: pointer;
      font-family: inherit; font-size: 0.9rem; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-logout svg { width: 18px; height: 18px; }

    /* Main Content */
    .main-content { padding: 80px 20px 40px; max-width: 800px; margin: 0 auto; }

    .page-header { text-align: center; margin-bottom: 25px; }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700; color: var(--brown-deep); }
    .page-subtitle { font-size: 0.9rem; color: var(--text-body); }

    /* Filter Chips */
    .filter-chips {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      margin-bottom: 20px;
    }
    .filter-chip {
      padding: 8px 16px; border: 1.5px solid var(--border-light);
      border-radius: 20px; background: var(--surface); cursor: pointer;
      font-family: inherit; font-size: 0.8rem; font-weight: 600;
      color: var(--text-body); transition: var(--transition-smooth);
    }
    .filter-chip:hover { border-color: var(--accent-bronze); color: var(--accent-bronze); }
    .filter-chip.active {
      background: var(--brown-deep); color: #fff; border-color: var(--brown-deep);
    }

    /* Timeline Style */
    .timeline {
      position: relative;
      padding-left: 30px;
    }
    .timeline::before {
      content: ''; position: absolute; left: 10px; top: 0; bottom: 0;
      width: 2px; background: linear-gradient(180deg, var(--accent-bronze), var(--brown-pale));
      border-radius: 2px;
    }

    .timeline-group {
      margin-bottom: 25px;
      position: relative;
    }
    .timeline-group::before {
      content: ''; position: absolute; left: -25px; top: 20px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--surface); border: 3px solid var(--accent-bronze);
      z-index: 1;
    }
    .group-date {
      font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
      padding-left: 5px;
    }

    .transaction-card {
      background: var(--surface); border-radius: var(--radius-medium);
      padding: 15px 18px; margin-bottom: 10px;
      box-shadow: var(--shadow-soft);
      display: flex; align-items: center; gap: 14px;
      transition: var(--transition-smooth);
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    .transaction-card:hover {
      box-shadow: var(--shadow-medium); transform: translateX(4px);
    }
    .transaction-card.deposit { border-left-color: var(--success-green); }
    .transaction-card.withdrawal { border-left-color: var(--error-red); }
    .transaction-card.investment { border-left-color: var(--accent-bronze); }
    .transaction-card.referral { border-left-color: var(--accent-gold); }

    .tx-icon {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .tx-icon.deposit { background: rgba(76,175,80,0.1); }
    .tx-icon.deposit svg { color: var(--success-green); }
    .tx-icon.withdrawal { background: rgba(229,57,53,0.1); }
    .tx-icon.withdrawal svg { color: var(--error-red); }
    .tx-icon.investment { background: rgba(205,127,50,0.1); }
    .tx-icon.investment svg { color: var(--accent-bronze); }
    .tx-icon.referral { background: rgba(218,165,32,0.1); }
    .tx-icon.referral svg { color: var(--accent-gold); }
    .tx-icon svg { width: 20px; height: 20px; }

    .tx-details { flex: 1; min-width: 0; }
    .tx-title { font-size: 0.85rem; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; }
    .tx-meta { font-size: 0.7rem; color: var(--text-muted); }
    .tx-amount { font-family: 'DM Mono', monospace; font-size: 0.9rem; font-weight: 700; flex-shrink: 0; }
    .tx-amount.credit { color: var(--success-green); }
    .tx-amount.debit { color: var(--error-red); }
    .tx-amount.neutral { color: var(--text-body); }
    .tx-status {
      font-size: 0.65rem; font-weight: 700; padding: 2px 8px;
      border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .status-completed { background: rgba(76,175,80,0.1); color: var(--success-green); }
    .status-pending { background: rgba(218,165,32,0.1); color: var(--accent-gold); }
    .status-failed { background: rgba(229,57,53,0.1); color: var(--error-red); }

    /* Empty State */
    .empty-state {
      text-align: center; padding: 60px 20px;
      background: var(--surface); border-radius: var(--radius-large);
      box-shadow: var(--shadow-soft);
    }
    .empty-state svg { width: 60px; height: 60px; margin-bottom: 15px; color: var(--brown-pale); }
    .empty-state h3 { font-size: 1.1rem; margin-bottom: 5px; color: var(--text-body); }
    .empty-state p { font-size: 0.8rem; color: var(--text-muted); }

    /* Loading Skeleton */
    .skeleton-card {
      background: var(--surface); border-radius: var(--radius-medium);
      padding: 15px 18px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 14px;
      animation: pulse 1.5s infinite;
    }
    .skeleton-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--brown-soft); }
    .skeleton-text { flex: 1; }
    .skeleton-line { height: 10px; background: var(--brown-soft); border-radius: 5px; margin-bottom: 5px; }
    .skeleton-line.short { width: 40%; }
    .skeleton-amount { width: 50px; height: 12px; background: var(--brown-soft); border-radius: 5px; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

    /* Toast */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: var(--surface); border-radius: var(--radius-medium);
      padding: 14px 18px; box-shadow: var(--shadow-large);
      display: flex; align-items: center; gap: 12px;
      transform: translateX(120%); transition: transform 0.5s;
      max-width: 350px; border-left: 4px solid var(--accent-bronze);
    }
    .toast.show { transform: translateX(0); }
    .toast.success { border-left-color: var(--success-green); }
    .toast.error { border-left-color: var(--error-red); }
    .toast-icon { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast.success .toast-icon { background: rgba(76,175,80,0.1); color: var(--success-green); }
    .toast.error .toast-icon { background: rgba(229,57,53,0.1); color: var(--error-red); }
    .toast-icon svg { width: 18px; height: 18px; }
    .toast-content h4 { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
    .toast-content p { font-size: 0.75rem; color: var(--text-body); }

    @media (max-width: 600px) {
      .main-content { padding: 70px 10px 30px; }
      .transaction-card { flex-wrap: wrap; }
      .tx-status { margin-left: 56px; }
    }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Hamburger -->
<button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <ul class="sidebar-nav">
    <li><a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a></li>
    <li><a href="invest.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>Invest</a></li>
    <li><a href="deposit-wallet.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Deposit Wallet</a></li>
    <li><a href="withdrawal-wallet.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="15" x2="22" y2="15"/></svg>Withdrawal Wallet</a></li>
    <li><a href="referrals.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Referrals</a></li>
    <li><a href="history.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>History</a></li>
    <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0z"/><path d="M12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a></li>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Sign Out
  </button>
</div>

<!-- Main Content -->
<div class="main-content">
  <div class="page-header">
    <h1 class="page-title">Transaction History</h1>
    <p class="page-subtitle">All your deposits, withdrawals, investments, and referral bonuses</p>
  </div>

  <!-- Filter Chips -->
  <div class="filter-chips" id="filterChips">
    <button class="filter-chip active" data-filter="all" onclick="filterTransactions('all', this)">All</button>
    <button class="filter-chip" data-filter="deposit" onclick="filterTransactions('deposit', this)">Deposits</button>
    <button class="filter-chip" data-filter="withdrawal" onclick="filterTransactions('withdrawal', this)">Withdrawals</button>
    <button class="filter-chip" data-filter="investment" onclick="filterTransactions('investment', this)">Investments</button>
    <button class="filter-chip" data-filter="referral" onclick="filterTransactions('referral', this)">Referrals</button>

  <!-- Timeline -->

      </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNxT46nSRdtD2cKmlqZ8ihx4Tk3QZ7Iuk",
    authDomain: "lumera-81730.firebaseapp.com",
    projectId: "lumera-81730",
    storageBucket: "lumera-81730.firebasestorage.app",
    messagingSenderId: "175198576882",
    appId: "1:175198576882:web:00367daecf932b821eb06b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let allTransactions = [];
  let currentFilter = 'all';

  // ===== SIDEBAR =====
  window.toggleSidebar = function() {
    document.getElementById('sidebar').classList.toggle('show');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  };

  // ===== TOAST =====
  function showToast(type, title, message) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <div class="toast-icon">
        ${type === 'success' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'}
      </div>
      <div class="toast-content"><h4>${title}</h4><p>${message}</p></div>
    `;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 4000);
  }

  // ===== FILTER TRANSACTIONS =====
  window.filterTransactions = function(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
    btn.classList.add('active');
    renderTransactions();
  };

  // ===== LOAD ALL TRANSACTIONS =====
  async function loadTransactions() {
    if (!currentUser) return;
    
    try {
      const transactions = [];
      
      // Load deposits
      const depositsRef = collection(db, 'deposits');
      const depositsQuery = query(depositsRef, where('uid', '==', currentUser.uid));
      const depositsSnapshot = await getDocs(depositsQuery);
      depositsSnapshot.forEach(doc => {
        const d = doc.data();
        transactions.push({
          id: doc.id,
          type: 'deposit',
          title: 'Deposit',
          amount: d.amount,
          status: d.status || 'pending',
          date: d.createdAt ? d.createdAt.toMillis() : Date.now()
        });
      });
      
      // Load withdrawals
      const withdrawalsRef = collection(db, 'withdrawals');
      const withdrawalsQuery = query(withdrawalsRef, where('uid', '==', currentUser.uid));
      const withdrawalsSnapshot = await getDocs(withdrawalsQuery);
      withdrawalsSnapshot.forEach(doc => {
        const d = doc.data();
        transactions.push({
          id: doc.id,
          type: 'withdrawal',
          title: 'Withdrawal',
          amount: d.amount,
          status: d.status || 'pending',
          date: d.createdAt ? d.createdAt.toMillis() : Date.now()
        });
      });
      
      // Load investments
      const investmentsRef = collection(db, 'investments');
      const investmentsQuery = query(investmentsRef, where('uid', '==', currentUser.uid));
      const investmentsSnapshot = await getDocs(investmentsQuery);
      investmentsSnapshot.forEach(doc => {
        const d = doc.data();
        transactions.push({
          id: doc.id,
          type: 'investment',
          title: 'Investment Purchase',
          amount: d.planAmount,
          status: d.status || 'active',
          date: d.startTime || Date.now()
        });
      });
      
      // Load referral bonuses
      const bonusesRef = collection(db, 'referralBonuses');
      const bonusesQuery = query(bonusesRef, where('referrerUid', '==', currentUser.uid));
      const bonusesSnapshot = await getDocs(bonusesQuery);
      bonusesSnapshot.forEach(doc => {
        const d = doc.data();
        transactions.push({
          id: doc.id,
          type: 'referral',
          title: 'Referral Bonus',
          amount: d.amount,
          status: 'completed',
          date: d.createdAt ? d.createdAt.toMillis() : Date.now()
        });
      });
      
      // Sort by date (newest first)
      transactions.sort((a, b) => b.date - a.date);
      allTransactions = transactions;
      
      renderTransactions();
      
    } catch (error) {
      console.error('Error loading transactions:', error);
      showToast('error', 'Error', 'Failed to load transaction history.');
      document.getElementById('timeline').innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h3>Error Loading</h3>
          <p>Please refresh the page to try again.</p>
        </div>
      `;
    }
  }

  // ===== RENDER TRANSACTIONS =====
  function renderTransactions() {
    const timeline = document.getElementById('timeline');
    
    const filtered = currentFilter === 'all' 
      ? allTransactions 
      : allTransactions.filter(tx => tx.type === currentFilter);
    
    if (filtered.length === 0) {
      timeline.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <h3>No Transactions Found</h3>
          <p>${currentFilter === 'all' ? 'No transactions yet.' : `No ${currentFilter} transactions found.`}</p>
        </div>
      `;
      return;
    }
    
    // Group by date
    const groups = {};
    filtered.forEach(tx => {
      const dateKey = new Date(tx.date).toDateString();
      if (!groups[dateKey]) groups[dateKey] = [];
      groups[dateKey].push(tx);
    });
    
    let html = '';
    Object.keys(groups).forEach(dateKey => {
      const today = new Date().toDateString();
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      let displayDate = dateKey;
      if (dateKey === today) displayDate = 'Today';
      else if (dateKey === yesterday) displayDate = 'Yesterday';
      
      html += `<div class="timeline-group"><div class="group-date">${displayDate}</div>`;
      
      groups[dateKey].forEach(tx => {
        html += renderTransactionCard(tx);
      });
      
      html += '</div>';
    });
    
    timeline.innerHTML = html;
  }

  function renderTransactionCard(tx) {
    const icons = {
      deposit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
      withdrawal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12h14"/></svg>',
      investment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
      referral: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>'
    };
    
    const amountClass = tx.type === 'deposit' || tx.type === 'referral' ? 'credit' : 'debit';
    const amountPrefix = tx.type === 'deposit' || tx.type === 'referral' ? '+' : '-';
    const statusClass = tx.status === 'completed' || tx.status === 'active' ? 'status-completed' : tx.status === 'pending' ? 'status-pending' : 'status-failed';
    const time = new Date(tx.date).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    
    return `
      <div class="transaction-card ${tx.type}">
        <div class="tx-icon ${tx.type}">${icons[tx.type]}</div>
        <div class="tx-details">
          <div class="tx-title">${tx.title}</div>
          <div class="tx-meta">${time}</div>
        </div>
        <div class="tx-amount ${amountClass}">${amountPrefix}$${tx.amount.toFixed(2)}</div>
        <span class="tx-status ${statusClass}">${tx.status}</span>
      </div>
    `;
  }

  // ===== LOGOUT =====
  window.logout = function() {
    if (confirm('Sign out?')) {
      signOut(auth).then(() => window.location.href = 'login.html');
    }
  };

  // ===== AUTH STATE =====
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      loadTransactions();
    } else {
      window.location.href = 'login.html';
    }
  });
</script>

</body>
</html>
