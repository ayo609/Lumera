<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Lumera – Create Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-dark: #0d0d1a; --bg-darker: #1a1a2e; --surface: #1a1a40; --surface-light: #242450;
      --gold: #e94560; --gold-light: #ff6b6b; --text-light: #ffffff; --text-muted: #a0a0b8;
      --border-light: rgba(255,255,255,0.08); --success-green: #4caf50; --error-red: #ff4444;
      --shadow-soft: 0 4px 20px rgba(0,0,0,0.3); --shadow-medium: 0 8px 40px rgba(0,0,0,0.5);
      --shadow-large: 0 20px 60px rgba(0,0,0,0.6);
      --radius-small: 8px; --radius-medium: 14px; --radius-large: 24px;
      --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body { font-family: 'Manrope', system-ui, sans-serif; background: var(--bg-dark); min-height: 100vh; color: var(--text-light); display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow-x: hidden; }

    body::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(233,69,96,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(26,26,64,0.3) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }

    .register-container {
      width: 100%; max-width: 450px;
      background: var(--surface);
      border-radius: var(--radius-large);
      padding: 40px 35px;
      position: relative; z-index: 1;
      box-shadow: var(--shadow-large);
      border: 1px solid var(--border-light);
      animation: slideUp 0.6s ease-out;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .register-container::before {
      content: '';
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 80px; height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 0 0 3px 3px;
    }

    .logo-section { text-align: center; margin-bottom: 30px; }
    .logo-badge {
      width: 70px; height: 70px; margin: 0 auto 15px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(233,69,96,0.4);
      position: relative;
    }
    .logo-badge::after {
      content: ''; position: absolute; inset: -3px;
      border: 2px solid rgba(233,69,96,0.3);
      border-radius: 22px;
      animation: pulse-ring 2s ease-in-out infinite;
    }
    @keyframes pulse-ring { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.05);opacity:0.5;} }
    .logo-badge svg { width: 32px; height: 32px; color: #fff; }
    .register-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
    .register-subtitle { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }

    .info-banner {
      background: rgba(233,69,96,0.1); border: 1px solid rgba(233,69,96,0.3);
      border-radius: var(--radius-small); padding: 12px 15px;
      font-size: 0.75rem; color: var(--gold-light);
      margin-bottom: 20px; text-align: center;
    }

    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 7px; }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 14px; color: var(--text-muted); pointer-events: none; display: flex; }
    .input-icon svg { width: 18px; height: 18px; }
    .form-control {
      width: 100%; height: 50px;
      background: var(--bg-darker);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-small);
      padding: 0 14px 0 44px;
      font-family: inherit; font-size: 0.9rem; color: var(--text-light);
      outline: none; transition: var(--transition-smooth);
    }
    .form-control::placeholder { color: rgba(255,255,255,0.3); font-size: 0.85rem; }
    .form-control:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(233,69,96,0.15); background: var(--surface-light); }
    .form-control.error { border-color: var(--error-red); }
    .form-group:focus-within .input-icon { color: var(--gold); }

    .toggle-password { position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 6px; display: flex; }
    .toggle-password:hover { color: var(--gold); }
    .toggle-password svg { width: 18px; height: 18px; }

    .error-message {
      display: none; background: rgba(255,68,68,0.1);
      border: 1px solid var(--error-red); border-radius: var(--radius-small);
      padding: 12px 15px; margin-bottom: 15px;
      font-size: 0.8rem; color: var(--error-red); text-align: center;
      animation: shake 0.5s;
    }
    .error-message.show { display: block; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

    .submit-btn {
      width: 100%; height: 52px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #fff; font-family: inherit; font-size: 1rem; font-weight: 700;
      border: none; border-radius: var(--radius-small); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: var(--transition-smooth); letter-spacing: 0.5px;
      position: relative; overflow: hidden;
    }
    .submit-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transition: left 0.5s; }
    .submit-btn:hover::before { left: 100%; }
    .submit-btn:hover { box-shadow: 0 8px 30px rgba(233,69,96,0.5); transform: translateY(-2px); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .button-spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link { text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--text-muted); }
    .back-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .back-link a:hover { color: var(--gold-light); }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--surface); border-radius: var(--radius-medium); padding: 14px 18px; box-shadow: var(--shadow-medium); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: transform 0.5s; max-width: 340px; border-left: 4px solid var(--gold); }
    .toast.show { transform: translateX(0); }
    .toast.success { border-left-color: var(--success-green); }
    .toast.error { border-left-color: var(--error-red); }
    .toast-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast.success .toast-icon { background: rgba(76,175,80,0.15); color: var(--success-green); }
    .toast.error .toast-icon { background: rgba(255,68,68,0.15); color: var(--error-red); }
    .toast-icon svg { width: 16px; height: 16px; }
    .toast-content h4 { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
    .toast-content p { font-size: 0.75rem; color: var(--text-muted); }

    @media (max-width: 480px) { .register-container { padding: 30px 25px; } }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="register-container">
  <div class="logo-section">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <h1 class="register-title">Create Admin</h1>
    <p class="register-subtitle">Developer Access Only</p>
  </div>

  <div class="info-banner">
    🔒 This page is restricted. A valid developer access key is required.
  </div>

  <div class="error-message" id="errorMessage">Invalid developer key. Access denied.</div>

  <div class="form-group">
    <label class="form-label">Developer Access Key</label>
    <div class="input-wrapper">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </span>
      <input type="password" class="form-control" id="devKey" placeholder="Enter developer access key" autocomplete="off" />
      <button class="toggle-password" type="button" onclick="toggleDevKey()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Admin Email</label>
    <div class="input-wrapper">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
      </span>
      <input type="email" class="form-control" id="adminEmail" placeholder="admin@lumera.com" autocomplete="email" />
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Admin Password</label>
    <div class="input-wrapper">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </span>
      <input type="password" class="form-control" id="adminPassword" placeholder="Minimum 6 characters" autocomplete="new-password" />
      <button class="toggle-password" type="button" onclick="toggleAdminPassword()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Confirm Password</label>
    <div class="input-wrapper">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </span>
      <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" />
    </div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="handleCreateAdmin()">
    <div class="button-spinner" id="spinner"></div>
    <span id="btnText">Create Admin Account</span>
  </button>

  <p class="back-link">
    <a href="admin-login.html">&larr; Back to Admin Login</a>
  </p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNxT46nSRdtD2cKmlqZ8ihx4Tk3QZ7Iuk",
    authDomain: "lumera-81730.firebaseapp.com",
    projectId: "lumera-81730",
    storageBucket: "lumera-81730.firebasestorage.app",
    messagingSenderId: "175198576882",
    appId: "1:175198576882:web:00367daecf932b821eb06b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ===== DEVELOPER ACCESS KEY =====
  // This is your secret key. Change this to your own unique key.
  const DEVELOPER_KEY = "LUMERA-DEV-2024-ADMIN-KEY-X9K3M";

  function showToast(type, title, message) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <div class="toast-icon">${type === 'success' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'}</div>
      <div class="toast-content"><h4>${title}</h4><p>${message}</p></div>
    `;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 4000);
  }

  function showError(message) {
    const errorEl = document.getElementById('errorMessage');
    errorEl.textContent = message;
    errorEl.classList.add('show');
    setTimeout(() => errorEl.classList.remove('show'), 4000);
  }

  window.toggleDevKey = function() {
    const input = document.getElementById('devKey');
    input.type = input.type === 'password' ? 'text' : 'password';
  };

  window.toggleAdminPassword = function() {
    const input = document.getElementById('adminPassword');
    input.type = input.type === 'password' ? 'text' : 'password';
  };

  window.handleCreateAdmin = async function() {
    const devKey = document.getElementById('devKey').value.trim();
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // Validate developer key
    if (devKey !== DEVELOPER_KEY) {
      showError('Invalid developer access key. Access denied.');
      return;
    }

    // Validate email
    if (!email) {
      showError('Please enter admin email.');
      return;
    }

    // Validate password
    if (!password || password.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }

    if (password !== confirmPassword) {
      showError('Passwords do not match.');
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');

    submitBtn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = 'Creating Admin...';

    try {
      // Create auth user
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const uid = userCredential.user.uid;

      // Save admin data to Firestore
      await setDoc(doc(db, 'users', uid), {
        uid: uid,
        email: email,
        isAdmin: true,
        role: 'super_admin',
        adminCreatedAt: serverTimestamp(),
        status: 'active',
        depositWallet: 0,
        withdrawalWallet: 0,
        totalDeposits: 0,
        totalWithdrawals: 0,
        activeInvestments: 0,
        referralEarnings: 0,
        totalEarnings: 0,
        currency: 'USD'
      });

      spinner.style.display = 'none';
      submitBtn.disabled = false;
      btnText.textContent = 'Create Admin Account';

      showToast('success', 'Admin Created! 🎉', 'Super admin account created successfully. Redirecting to admin login...');

      // Clear form
      document.getElementById('devKey').value = '';
      document.getElementById('adminEmail').value = '';
      document.getElementById('adminPassword').value = '';
      document.getElementById('confirmPassword').value = '';

      setTimeout(() => {
        window.location.href = 'admin-login.html';
      }, 2000);

    } catch (error) {
      spinner.style.display = 'none';
      submitBtn.disabled = false;
      btnText.textContent = 'Create Admin Account';

      const errorMessages = {
        'auth/email-already-in-use': 'This email is already registered.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/weak-password': 'Password is too weak. Use at least 6 characters.',
        'auth/network-request-failed': 'Network error. Check your connection.',
        'auth/too-many-requests': 'Too many attempts. Please try again later.'
      };

      showError(errorMessages[error.code] || 'Failed to create admin. Please try again.');
    }
  };
</script>

</body>
</html>
