<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Lumera – Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-cream: #faf7f2; --surface: #ffffff;
      --brown-deep: #3e2723; --brown-mid: #5d4037;
      --brown-light: #8d6e63; --brown-pale: #d7ccc8; --brown-soft: #f5f0eb;
      --accent-bronze: #cd7f32; --accent-gold: #daa520;
      --text-dark: #2c1810; --text-body: #5c4a3d; --text-muted: #9e8b7d;
      --success-green: #4caf50; --error-red: #e53935;
      --warning-orange: #ff9800; --info-blue: #2196f3;
      --border-light: #e8e0d8;
      --shadow-soft: 0 4px 20px rgba(62, 39, 35, 0.06);
      --shadow-medium: 0 8px 40px rgba(62, 39, 35, 0.1);
      --radius-small: 6px; --radius-medium: 12px; --radius-large: 20px;
      --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body { font-family: 'Manrope', system-ui, sans-serif; background: var(--bg-cream); min-height: 100vh; color: var(--text-dark); position: relative; overflow-x: hidden; }

    .hamburger { position: fixed; top: 20px; left: 20px; z-index: 1000; background: var(--brown-deep); border: none; width: 45px; height: 45px; border-radius: var(--radius-small); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-shadow: var(--shadow-medium); }
    .hamburger span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; }

    .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 998; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .sidebar-overlay.show { opacity: 1; pointer-events: auto; }
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: var(--surface); z-index: 999; transition: left 0.3s; box-shadow: var(--shadow-large); display: flex; flex-direction: column; padding: 80px 0 20px; overflow-y: auto; }
    .sidebar.show { left: 0; }
    .sidebar-nav { list-style: none; padding: 0 15px; flex: 1; }
    .sidebar-nav li { margin-bottom: 5px; }
    .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-body); text-decoration: none; font-size: 0.9rem; font-weight: 600; border-radius: var(--radius-small); transition: var(--transition-smooth); }
    .sidebar-nav a:hover, .sidebar-nav a.active { background: var(--brown-soft); color: var(--brown-deep); }
    .sidebar-nav a svg { width: 18px; height: 18px; }
    .sidebar-logout { margin: 20px 15px 0; padding: 12px 15px; background: var(--error-red); color: #fff; border: none; border-radius: var(--radius-small); cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .sidebar-logout svg { width: 18px; height: 18px; }

    .main-content { padding: 80px 20px 40px; max-width: 650px; margin: 0 auto; }
    .page-header { text-align: center; margin-bottom: 25px; }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700; color: var(--brown-deep); margin-bottom: 5px; }
    .page-subtitle { font-size: 0.9rem; color: var(--text-body); }

    /* Filter Tabs */
    .filter-tabs { display: flex; gap: 5px; margin-bottom: 20px; background: var(--surface); border-radius: var(--radius-medium); padding: 5px; box-shadow: var(--shadow-soft); }
    .filter-tab { flex: 1; padding: 10px; border: none; border-radius: var(--radius-small); background: transparent; cursor: pointer; font-family: inherit; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); transition: var(--transition-smooth); }
    .filter-tab.active { background: var(--brown-deep); color: #fff; }
    .filter-tab:hover:not(.active) { background: var(--brown-soft); }
    .filter-tab .count { display: inline-block; margin-left: 4px; font-size: 0.65rem; background: rgba(0,0,0,0.1); border-radius: 10px; padding: 1px 6px; }
    .filter-tab.active .count { background: rgba(255,255,255,0.2); }

    /* Alerts List */
    .alerts-list { display: flex; flex-direction: column; gap: 10px; }
    .alert-item {
      background: var(--surface); border-radius: var(--radius-medium);
      padding: 16px 18px; box-shadow: var(--shadow-soft);
      display: flex; align-items: flex-start; gap: 14px;
      transition: var(--transition-smooth); cursor: pointer;
      border-left: 4px solid var(--info-blue);
      position: relative;
    }
    .alert-item:hover { box-shadow: var(--shadow-medium); transform: translateX(3px); }
    .alert-item.unread { background: #fffdf8; }
    .alert-item.unread::after {
      content: ''; position: absolute; top: 15px; right: 15px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--error-red);
    }
    .alert-item.success { border-left-color: var(--success-green); }
    .alert-item.warning { border-left-color: var(--warning-orange); }
    .alert-item.error { border-left-color: var(--error-red); }
    .alert-item.info { border-left-color: var(--info-blue); }

    .alert-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .alert-icon.success { background: rgba(76,175,80,0.1); color: var(--success-green); }
    .alert-icon.warning { background: rgba(255,152,0,0.1); color: var(--warning-orange); }
    .alert-icon.error { background: rgba(229,57,53,0.1); color: var(--error-red); }
    .alert-icon.info { background: rgba(33,150,243,0.1); color: var(--info-blue); }
    .alert-icon svg { width: 18px; height: 18px; }

    .alert-body { flex: 1; min-width: 0; }
    .alert-title { font-size: 0.85rem; font-weight: 700; color: var(--text-dark); margin-bottom: 3px; }
    .alert-message { font-size: 0.8rem; color: var(--text-body); line-height: 1.4; }
    .alert-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; display: flex; align-items: center; gap: 4px; }
    .alert-time svg { width: 12px; height: 12px; }

    /* Mark All Read Button */
    .mark-all-btn {
      display: block; margin: 0 auto 15px;
      padding: 10px 20px; background: var(--brown-deep); color: #fff;
      border: none; border-radius: var(--radius-small); cursor: pointer;
      font-family: inherit; font-size: 0.8rem; font-weight: 700;
      transition: var(--transition-smooth);
    }
    .mark-all-btn:hover { background: var(--brown-mid); box-shadow: 0 4px 12px rgba(62,39,35,0.3); }
    .mark-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Empty State */
    .empty-state { text-align: center; padding: 50px 20px; background: var(--surface); border-radius: var(--radius-large); box-shadow: var(--shadow-soft); }
    .empty-state svg { width: 60px; height: 60px; margin-bottom: 15px; color: var(--brown-pale); }
    .empty-state h3 { font-size: 1.1rem; margin-bottom: 5px; color: var(--text-body); }
    .empty-state p { font-size: 0.8rem; color: var(--text-muted); }

    /* Toast */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--surface); border-radius: var(--radius-medium); padding: 14px 18px; box-shadow: var(--shadow-large); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: transform 0.5s; max-width: 340px; border-left: 4px solid var(--accent-bronze); }
    .toast.show { transform: translateX(0); }
    .toast.success { border-left-color: var(--success-green); }
    .toast.error { border-left-color: var(--error-red); }
    .toast-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast.success .toast-icon { background: rgba(76,175,80,0.1); color: var(--success-green); }
    .toast.error .toast-icon { background: rgba(229,57,53,0.1); color: var(--error-red); }
    .toast-icon svg { width: 16px; height: 16px; }
    .toast-content h4 { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
    .toast-content p { font-size: 0.75rem; color: var(--text-body); }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1500; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--surface); border-radius: var(--radius-large); padding: 25px; max-width: 380px; width: 100%; box-shadow: var(--shadow-large); animation: modalIn 0.3s; text-align: center; }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .modal-icon { width: 55px; height: 55px; margin: 0 auto 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .modal-icon.warning { background: rgba(205,127,50,0.1); color: var(--accent-bronze); }
    .modal-icon svg { width: 26px; height: 26px; }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 700; color: var(--brown-deep); margin-bottom: 10px; }
    .modal-message { font-size: 0.85rem; color: var(--text-body); margin-bottom: 20px; }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-btn { flex: 1; padding: 11px; border: none; border-radius: var(--radius-small); cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 700; transition: var(--transition-smooth); }
    .modal-btn.confirm { background: var(--brown-deep); color: #fff; }
    .modal-btn.confirm:hover { background: var(--brown-mid); }
    .modal-btn.cancel { background: var(--brown-soft); color: var(--text-body); }
    .modal-btn.cancel:hover { background: var(--brown-pale); }

    @media (max-width: 500px) {
      .main-content { padding: 70px 10px 30px; }
      .filter-tabs { flex-wrap: wrap; }
      .filter-tab { flex: 1 1 40%; }
    }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon warning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
    <h3 class="modal-title" id="modalTitle">Confirm</h3>
    <p class="modal-message" id="modalMessage">Are you sure?</p>
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="confirmModalAction()">Confirm</button>
    </div>
  </div>
</div>

<button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
  <ul class="sidebar-nav">
    <li><a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a></li>
    <li><a href="invest.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>Invest</a></li>
    <li><a href="deposit-wallet.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Deposit Wallet</a></li>
    <li><a href="withdrawal-wallet.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="15" x2="22" y2="15"/></svg>Withdrawal Wallet</a></li>
    <li><a href="referrals.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Referrals</a></li>
    <li><a href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>History</a></li>
    <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0z"/><path d="M12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a></li>
    <li><a href="alerts.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>Alerts</a></li>
  </ul>
  <button class="sidebar-logout" onclick="showLogoutConfirm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</button>
</div>

<div class="main-content">
  <div class="page-header">
    <h1 class="page-title">Alerts</h1>
    <p class="page-subtitle">Stay updated with your account activities</p>
  </div>

  <button class="mark-all-btn" id="markAllBtn" onclick="showMarkAllConfirm()">Mark All as Read</button>

  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="all" onclick="filterAlerts('all', this)">All <span class="count" id="countAll">0</span></button>
    <button class="filter-tab" data-filter="unread" onclick="filterAlerts('unread', this)">Unread <span class="count" id="countUnread">0</span></button>
    <button class="filter-tab" data-filter="success" onclick="filterAlerts('success', this)">Success</button>
    <button class="filter-tab" data-filter="warning" onclick="filterAlerts('warning', this)">Warning</button>
    <button class="filter-tab" data-filter="error" onclick="filterAlerts('error', this)">Error</button>
  </div>

  <div class="alerts-list" id="alertsList">
    <!-- Alerts will be loaded here -->
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNxT46nSRdtD2cKmlqZ8ihx4Tk3QZ7Iuk",
    authDomain: "lumera-81730.firebaseapp.com",
    projectId: "lumera-81730",
    storageBucket: "lumera-81730.firebasestorage.app",
    messagingSenderId: "175198576882",
    appId: "1:175198576882:web:00367daecf932b821eb06b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentFilter = 'all';
  let modalAction = null;
  let allAlerts = [];

  window.toggleSidebar = function() {
    document.getElementById('sidebar').classList.toggle('show');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  };

  function showToast(type, title, message) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <div class="toast-icon">${type === 'success' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'}</div>
      <div class="toast-content"><h4>${title}</h4><p>${message}</p></div>
    `;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 4000);
  }

  function showModal(title, message, action) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    modalAction = action;
    document.getElementById('modalOverlay').classList.add('show');
  }
  window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('show'); modalAction = null; };
  window.confirmModalAction = function() { if (modalAction) modalAction(); closeModal(); };

  window.showLogoutConfirm = function() {
    showModal('Sign Out', 'Are you sure you want to sign out?', async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    });
  };

  window.showMarkAllConfirm = function() {
    const unreadCount = allAlerts.filter(a => !a.read).length;
    if (unreadCount === 0) {
      showToast('error', 'No Unread', 'All alerts are already read.');
      return;
    }
    showModal('Mark All Read', `Mark all ${unreadCount} unread alerts as read?`, async () => {
      try {
        for (const alert of allAlerts) {
          if (!alert.read) {
            await updateDoc(doc(db, 'alerts', alert.id), { read: true });
          }
        }
        allAlerts.forEach(a => a.read = true);
        renderAlerts();
        updateCounts();
        showToast('success', 'Done', 'All alerts marked as read.');
      } catch (error) {
        showToast('error', 'Error', 'Failed to update alerts.');
      }
    });
  };

  window.filterAlerts = function(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderAlerts();
  };

  async function loadAlerts() {
    if (!currentUser) return;
    const list = document.getElementById('alertsList');
    list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:30px;">Loading alerts...</p>';

    try {
      const alertsRef = collection(db, 'alerts');
      const q = query(alertsRef, where('uid', '==', currentUser.uid));
      const snapshot = await getDocs(q);
      
      allAlerts = [];
      snapshot.forEach(doc => {
        const d = doc.data();
        allAlerts.push({
          id: doc.id,
          title: d.title || 'Alert',
          message: d.message || '',
          type: d.type || 'info',
          read: d.read || false,
          time: d.createdAt ? d.createdAt.toMillis() : Date.now()
        });
      });
      
      allAlerts.sort((a, b) => b.time - a.time);
      updateCounts();
      renderAlerts();
      
    } catch (error) {
      console.error('Error loading alerts:', error);
      // Show demo alerts if Firestore collection doesn't exist
      allAlerts = [
        { id: 'demo1', title: 'Welcome to Lumera!', message: 'Your account has been created successfully.', type: 'success', read: false, time: Date.now() - 3600000 },
        { id: 'demo2', title: 'Deposit Pending', message: 'Your deposit request is awaiting admin verification.', type: 'warning', read: false, time: Date.now() - 7200000 },
        { id: 'demo3', title: 'ROI Credited', message: '$1.00 has been added to your withdrawal wallet.', type: 'success', read: true, time: Date.now() - 86400000 },
        { id: 'demo4', title: 'Security Notice', message: 'Always keep your login credentials safe and secure.', type: 'info', read: false, time: Date.now() - 172800000 }
      ];
      updateCounts();
      renderAlerts();
    }
  }

  function updateCounts() {
    document.getElementById('countAll').textContent = allAlerts.length;
    document.getElementById('countUnread').textContent = allAlerts.filter(a => !a.read).length;
  }

  function renderAlerts() {
    const list = document.getElementById('alertsList');
    
    let filtered = allAlerts;
    if (currentFilter === 'unread') {
      filtered = allAlerts.filter(a => !a.read);
    } else if (currentFilter !== 'all') {
      filtered = allAlerts.filter(a => a.type === currentFilter);
    }

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <h3>No Alerts</h3>
          <p>${currentFilter === 'all' ? 'You have no alerts yet.' : `No ${currentFilter} alerts found.`}</p>
        </div>
      `;
      return;
    }

    list.innerHTML = filtered.map(alert => {
      const icons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
        warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
      };
      
      const timeStr = formatTime(alert.time);
      
      return `
        <div class="alert-item ${alert.type} ${!alert.read ? 'unread' : ''}" onclick="markAsRead('${alert.id}')">
          <div class="alert-icon ${alert.type}">${icons[alert.type]}</div>
          <div class="alert-body">
            <div class="alert-title">${alert.title}</div>
            <div class="alert-message">${alert.message}</div>
            <div class="alert-time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${timeStr}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function formatTime(timestamp) {
    const now = Date.now();
    const diff = now - timestamp;
    if (diff < 60000) return 'Just now';
    if (diff < 3600000) return `${Math.floor(diff / 60000)} min ago`;
    if (diff < 86400000) return `${Math.floor(diff / 3600000)} hours ago`;
    return new Date(timestamp).toLocaleDateString();
  }

  window.markAsRead = async function(alertId) {
    const alert = allAlerts.find(a => a.id === alertId);
    if (!alert || alert.read) return;
    
    try {
      await updateDoc(doc(db, 'alerts', alertId), { read: true });
    } catch (error) {
      // Ignore if collection doesn't exist
    }
    
    alert.read = true;
    updateCounts();
    renderAlerts();
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      loadAlerts();
    } else {
      window.location.href = 'login.html';
    }
  });
</script>

</body>
</html>
