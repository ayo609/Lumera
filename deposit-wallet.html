<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Nexa – Deposit Wallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-cream: #faf7f2;
      --surface: #ffffff;
      --brown-deep: #3e2723;
      --brown-mid: #5d4037;
      --brown-light: #8d6e63;
      --brown-pale: #d7ccc8;
      --accent-bronze: #cd7f32;
      --accent-gold: #daa520;
      --text-dark: #2c1810;
      --text-body: #5c4a3d;
      --text-muted: #9e8b7d;
      --success-green: #4caf50;
      --error-red: #e53935;
      --border-light: #e8e0d8;
      --shadow-soft: 0 4px 20px rgba(62, 39, 35, 0.06);
      --shadow-medium: 0 8px 40px rgba(62, 39, 35, 0.1);
      --radius-small: 6px;
      --radius-medium: 12px;
      --radius-large: 20px;
      --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg-cream);
      min-height: 100vh;
      color: var(--text-dark);
      position: relative;
      overflow-x: hidden;
    }

    /* Main Content */
    .main-content {
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .page-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--brown-deep);
      margin-bottom: 5px;
    }

    .page-subtitle {
      font-size: 0.9rem;
      color: var(--text-body);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--brown-deep);
      color: #fff;
      border: none;
      border-radius: var(--radius-small);
      padding: 10px 18px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      text-decoration: none;
      transition: var(--transition-smooth);
    }

    .back-btn:hover {
      background: var(--brown-mid);
    }

    /* Deposit Card */
    .deposit-card {
      background: var(--surface);
      border-radius: var(--radius-large);
      padding: 30px;
      box-shadow: var(--shadow-medium);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--brown-deep);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 18px;
      height: 18px;
      color: var(--accent-bronze);
    }

    /* Amount Selection */
    .amount-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .amount-btn {
      padding: 12px;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-small);
      background: var(--bg-cream);
      cursor: pointer;
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-dark);
      transition: var(--transition-smooth);
    }

    .amount-btn:hover {
      border-color: var(--accent-bronze);
      background: #fff8f0;
    }

    .amount-btn.selected {
      background: var(--brown-deep);
      color: #ffffff;
      border-color: var(--brown-deep);
    }

    /* Custom Amount Input */
    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--brown-mid);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--accent-bronze);
      font-weight: 700;
      font-size: 1rem;
    }

    .form-control {
      width: 100%;
      height: 48px;
      background: var(--bg-cream);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-small);
      padding: 0 14px 0 35px;
      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      transition: var(--transition-smooth);
    }

    .form-control:focus {
      border-color: var(--accent-bronze);
      box-shadow: 0 0 0 3px rgba(205, 127, 50, 0.1);
      background: #ffffff;
    }

    /* Wallet Address */
    .wallet-address {
      background: var(--bg-cream);
      border: 1px dashed var(--border-light);
      border-radius: var(--radius-small);
      padding: 15px;
      margin-bottom: 15px;
    }

    .wallet-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .wallet-address-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-small);
      padding: 10px 12px;
    }

    .wallet-address-text {
      flex: 1;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-dark);
      word-break: break-all;
    }

    .copy-btn {
      background: var(--brown-deep);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-small);
      padding: 8px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition-smooth);
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: var(--brown-mid);
    }

    .copy-btn svg {
      width: 14px;
      height: 14px;
    }

    .network-badge {
      display: inline-block;
      background: var(--accent-bronze);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    /* File Upload */
    .upload-area {
      border: 2px dashed var(--border-light);
      border-radius: var(--radius-medium);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition-smooth);
      margin-bottom: 15px;
      position: relative;
    }

    .upload-area:hover {
      border-color: var(--accent-bronze);
      background: #fff8f0;
    }

    .upload-area.dragover {
      border-color: var(--accent-bronze);
      background: #fff8f0;
    }

    .upload-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 10px;
      color: var(--accent-bronze);
    }

    .upload-icon svg {
      width: 100%;
      height: 100%;
    }

    .upload-text {
      font-size: 0.85rem;
      color: var(--text-body);
    }

    .upload-text strong {
      color: var(--accent-bronze);
    }

    .file-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .preview-container {
      display: none;
      margin-bottom: 15px;
      position: relative;
    }

    .preview-container.show {
      display: block;
    }

    .preview-image {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: var(--radius-small);
      border: 1px solid var(--border-light);
    }

    .preview-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .remove-file {
      background: var(--error-red);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-small);
      padding: 5px 10px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, var(--brown-deep) 0%, var(--brown-mid) 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-small);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition-smooth);
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, var(--brown-mid) 0%, var(--brown-deep) 100%);
      box-shadow: 0 8px 25px rgba(62, 39, 35, 0.3);
      transform: translateY(-2px);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .button-spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: #ffffff;
      border-radius: var(--radius-medium);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-medium);
      transform: translateX(120%);
      transition: transform 0.5s;
      pointer-events: auto;
      max-width: 350px;
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast.success {
      border-right: 4px solid var(--success-green);
    }

    .toast.error {
      border-right: 4px solid var(--error-red);
    }

    .toast-icon {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toast.success .toast-icon {
      background: rgba(76, 175, 80, 0.1);
      color: var(--success-green);
    }

    .toast.error .toast-icon {
      background: rgba(229, 57, 53, 0.1);
      color: var(--error-red);
    }

    .toast-icon svg {
      width: 18px;
      height: 18px;
    }

    .toast-content h4 {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .toast-content p {
      font-size: 0.8rem;
      color: var(--text-body);
    }

    @media (max-width: 480px) {
      .amount-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .deposit-card {
        padding: 20px;
      }
      .toast-container {
        left: 20px;
        right: 20px;
      }
    }
  </style>
</head>
<body>

<!-- Main Content -->
<div class="main-content">
  
  <a href="dashboard.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg>
    Back to Dashboard
  </a>

  <div class="page-header">
    <h1 class="page-title">Deposit Wallet</h1>
    <p class="page-subtitle">Fund your account with USDT (BEP20)</p>
  </div>

  <div class="deposit-card">
    
    <!-- Amount Selection -->
    <div class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      Select Deposit Amount
    </div>

    <div class="amount-grid">
      <button class="amount-btn" onclick="selectAmount(10)">$10</button>
      <button class="amount-btn" onclick="selectAmount(20)">$20</button>
      <button class="amount-btn" onclick="selectAmount(50)">$50</button>
      <button class="amount-btn" onclick="selectAmount(100)">$100</button>
      <button class="amount-btn" onclick="selectAmount(200)">$200</button>
      <button class="amount-btn" onclick="selectAmount(500)">$500</button>
      <button class="amount-btn" onclick="selectAmount(1000)">$1000</button>
    </div>

    <div class="input-group">
      <label class="input-label">Or Enter Custom Amount</label>
      <div class="input-wrapper">
        <span class="input-icon">$</span>
        <input type="number" class="form-control" id="customAmount" placeholder="Minimum $10" min="10" step="1" />
      </div>
    </div>

    <!-- Wallet Address -->
    <div class="card-title" style="margin-top: 25px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      Wallet Address
    </div>

    <div class="wallet-address">
      <div class="wallet-label">
        <span class="network-badge">BEP20</span> USDT Only
      </div>
      <div class="wallet-address-box">
        <span class="wallet-address-text" id="walletAddress">0x7c1A4b6192aD4180FA006Eb8A108cD7E680E0EC5</span>
        <button class="copy-btn" onclick="copyAddress(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy
        </button>
      </div>
    </div>

    <!-- Upload Payment Screenshot -->
    <div class="card-title" style="margin-top: 25px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload Payment Screenshot
    </div>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <div class="upload-text">
        <strong>Click to upload</strong> or drag & drop<br/>
        Payment screenshot (JPG/PNG)
      </div>
      <input type="file" class="file-input" id="fileInput" accept="image/*" />
    </div>

    <div class="preview-container" id="previewContainer">
      <img src="" alt="Payment Screenshot" class="preview-image" id="previewImage" />
      <div class="preview-info">
        <span id="fileInfo">Screenshot ready</span>
        <button class="remove-file" onclick="removeFile()">Remove</button>
      </div>
    </div>

    <!-- Submit Button -->
    <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">
      <div class="button-spinner" id="spinner"></div>
      <span id="submitText">Submit Deposit Request</span>
    </button>

  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ✅ Updated Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyAXVLeBN6rROvG6tEUN5WD8X1SZ4hatBxA",
    authDomain: "nexa-co.firebaseapp.com",
    projectId: "nexa-co",
    storageBucket: "nexa-co.firebasestorage.app",
    messagingSenderId: "345722583751",
    appId: "1:345722583751:web:b987628aa77bce38629ce2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let selectedAmount = 0;
  let uploadedImage = null;

  // Check auth state
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    currentUser = user;
  });

  // ===== TOAST =====
  function showToast(type, title, message) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <div class="toast-icon">
        ${type === 'success' 
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' 
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'}
      </div>
      <div class="toast-content">
        <h4>${title}</h4>
        <p>${message}</p>
      </div>
    `;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 500);
    }, 4000);
  }

  // ===== COPY ADDRESS =====
  window.copyAddress = function(button) {
    const text = document.getElementById('walletAddress').textContent.trim();
    navigator.clipboard.writeText(text).then(() => {
      const original = button.innerHTML;
      button.textContent = 'Copied!';
      setTimeout(() => {
        button.innerHTML = original;
      }, 2000);
      showToast('success', 'Copied!', 'Wallet address copied to clipboard.');
    }).catch(() => {
      showToast('error', 'Failed', 'Could not copy address.');
    });
  };

  // ===== SELECT AMOUNT =====
  window.selectAmount = function(amount) {
    selectedAmount = amount;
    document.getElementById('customAmount').value = amount;
    
    document.querySelectorAll('.amount-btn').forEach(btn => {
      btn.classList.remove('selected');
      if (btn.textContent === `$${amount}`) {
        btn.classList.add('selected');
      }
    });
  };

  // Custom amount input
  document.getElementById('customAmount').addEventListener('input', (e) => {
    selectedAmount = parseFloat(e.target.value) || 0;
    document.querySelectorAll('.amount-btn').forEach(btn => {
      btn.classList.remove('selected');
    });
  });

  // ===== FILE UPLOAD =====
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');

  uploadArea.addEventListener('click', (e) => {
    if (e.target !== fileInput) {
      fileInput.click();
    }
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      compressAndPreview(file);
    }
  });

  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });

  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });

  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      compressAndPreview(file);
    } else {
      showToast('error', 'Invalid File', 'Please upload an image file (JPG or PNG).');
    }
  });

  function compressAndPreview(file) {
    // Validate file type
    if (!file.type.startsWith('image/')) {
      showToast('error', 'Invalid File', 'Please upload an image file.');
      return;
    }

    // Validate file size (max 10MB)
    if (file.size > 10 * 1024 * 1024) {
      showToast('error', 'File Too Large', 'Maximum file size is 10MB.');
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxWidth = 800;
        const maxHeight = 600;
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = (maxWidth / width) * height;
          width = maxWidth;
        }
        if (height > maxHeight) {
          width = (maxHeight / height) * width;
          height = maxHeight;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // Compress to JPEG
        let quality = 0.6;
        let compressedBase64 = canvas.toDataURL('image/jpeg', quality);
        
        // Further compress if still too large
        while (compressedBase64.length > 500000 && quality > 0.2) {
          quality -= 0.1;
          compressedBase64 = canvas.toDataURL('image/jpeg', quality);
        }

        uploadedImage = compressedBase64;
        const sizeKB = (compressedBase64.length * 0.75 / 1024).toFixed(1);

        document.getElementById('previewImage').src = compressedBase64;
        document.getElementById('previewContainer').classList.add('show');
        document.getElementById('fileInfo').textContent = `Compressed: ${sizeKB} KB`;
        document.getElementById('uploadArea').style.display = 'none';

        showToast('success', 'Screenshot Uploaded', `Image compressed to ${sizeKB} KB.`);
      };
      img.onerror = () => {
        showToast('error', 'Error', 'Could not process image. Please try another file.');
      };
      img.src = e.target.result;
    };
    reader.onerror = () => {
      showToast('error', 'Error', 'Could not read file.');
    };
    reader.readAsDataURL(file);
  }

  window.removeFile = function() {
    uploadedImage = null;
    fileInput.value = '';
    document.getElementById('previewContainer').classList.remove('show');
    document.getElementById('uploadArea').style.display = 'block';
    showToast('info', 'Removed', 'Screenshot removed. Please upload a new one.');
  };

  // ===== SUBMIT =====
  window.handleSubmit = async function() {
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const submitText = document.getElementById('submitText');

    // Validate amount
    if (selectedAmount < 10) {
      showToast('error', 'Invalid Amount', 'Minimum deposit is $10.');
      return;
    }

    // Validate screenshot
    if (!uploadedImage) {
      showToast('error', 'Missing Screenshot', 'Please upload your payment screenshot.');
      return;
    }

    // Validate user
    if (!currentUser) {
      showToast('error', 'Not Logged In', 'Please login first.');
      return;
    }

    submitBtn.disabled = true;
    spinner.style.display = 'block';
    submitText.textContent = 'Submitting...';

    try {
      const depositData = {
        userId: currentUser.uid,
        userEmail: currentUser.email || '',
        amount: selectedAmount,
        walletAddress: '0x7c1A4b6192aD4180FA006Eb8A108cD7E680E0EC5',
        receiptImage: uploadedImage,
        network: 'BEP20',
        currency: 'USDT',
        status: 'pending',
        reviewed: false,
        createdAt: serverTimestamp()
      };

      // ✅ Save to Firestore using addDoc (auto-generates ID)
      const docRef = await addDoc(collection(db, 'deposits'), depositData);
      
      console.log('✅ Deposit saved with ID:', docRef.id);

      spinner.style.display = 'none';
      submitBtn.style.display = 'none';

      showToast('success', 'Deposit Submitted! 🎉', `$${selectedAmount} USDT deposit sent for verification.`);
      
      // Redirect to dashboard after 2 seconds
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 2000);

    } catch (error) {
      console.error('❌ Submit error:', error);
      spinner.style.display = 'none';
      submitBtn.disabled = false;
      submitText.textContent = 'Submit Deposit Request';
      showToast('error', 'Submission Failed', error.message || 'Please try again.');
    }
  };
</script>

</body>
</html>
