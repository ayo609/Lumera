<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Lumera – Admin Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-dark: #1a1a2e; --bg-darker: #16213e; --surface: #1a1a40; --surface-light: #242450;
      --gold: #e94560; --gold-light: #ff6b6b; --text-light: #ffffff; --text-muted: #a0a0b8;
      --border-light: rgba(255,255,255,0.08); --success-green: #4caf50; --error-red: #ff4444;
      --warning-orange: #ff9800; --info-blue: #2196f3;
      --shadow-soft: 0 4px 20px rgba(0,0,0,0.2); --shadow-medium: 0 8px 40px rgba(0,0,0,0.4);
      --radius-small: 8px; --radius-medium: 14px; --radius-large: 20px;
      --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body { font-family: 'Manrope', system-ui, sans-serif; background: var(--bg-dark); min-height: 100vh; color: var(--text-light); overflow-x: hidden; }

    .top-bar { position: fixed; top: 0; left: 0; right: 0; background: var(--bg-darker); border-bottom: 1px solid var(--border-light); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
    .top-bar-left { display: flex; align-items: center; gap: 15px; }
    .hamburger { background: var(--surface-light); border: none; width: 40px; height: 40px; border-radius: var(--radius-small); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .hamburger span { display: block; width: 20px; height: 2px; background: var(--text-light); border-radius: 2px; }
    .top-bar-title { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 700; color: var(--gold); }
    .logout-btn { padding: 8px 15px; background: var(--error-red); color: #fff; border: none; border-radius: var(--radius-small); cursor: pointer; font-family: inherit; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .logout-btn:hover { background: #cc0000; }
    .logout-btn svg { width: 14px; height: 14px; }

    .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 98; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .sidebar-overlay.show { opacity: 1; pointer-events: auto; }
    .sidebar { position: fixed; top: 0; left: -260px; width: 260px; height: 100vh; background: var(--bg-darker); z-index: 99; transition: left 0.3s; border-right: 1px solid var(--border-light); display: flex; flex-direction: column; padding: 70px 0 20px; overflow-y: auto; }
    .sidebar.show { left: 0; }
    .sidebar-nav { list-style: none; padding: 0 12px; flex: 1; }
    .sidebar-nav li { margin-bottom: 4px; }
    .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 11px 14px; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; border-radius: var(--radius-small); transition: var(--transition-smooth); }
    .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(233,69,96,0.1); color: var(--gold); }
    .sidebar-nav a svg { width: 17px; height: 17px; flex-shrink: 0; }

    .main-content { padding: 80px 20px 30px; max-width: 1000px; margin-left: auto; margin-right: auto; }
    .page-header { margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 700; color: var(--text-light); }
    .page-subtitle { font-size: 0.85rem; color: var(--text-muted); }
    .new-alert-btn { padding: 12px 20px; background: var(--gold); color: #fff; border: none; border-radius: var(--radius-small); cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 8px; transition: var(--transition-smooth); }
    .new-alert-btn:hover { background: var(--gold-light); box-shadow: 0 4px 15px rgba(233,69,96,0.4); }
    .new-alert-btn svg { width: 16px; height: 16px; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat-mini { background: var(--surface); border-radius: var(--radius-medium); padding: 18px; border: 1px solid var(--border-light); text-align: center; }
    .stat-mini-value { font-family: 'DM Mono', monospace; font-size: 1.2rem; font-weight: 700; }
    .stat-mini-value.total { color: var(--gold); }
    .stat-mini-value.broadcast { color: var(--info-blue); }
    .stat-mini-value.user { color: var(--success-green); }
    .stat-mini-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    /* Alert Cards */
    .alerts-list { display: flex; flex-direction: column; gap: 12px; }
    .alert-card {
      background: var(--surface); border-radius: var(--radius-medium);
      padding: 18px 20px; border: 1px solid var(--border-light);
      display: flex; align-items: flex-start; gap: 14px;
      transition: var(--transition-smooth);
    }
    .alert-card:hover { border-color: var(--gold); transform: translateX(3px); }
    .alert-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .alert-icon.success { background: rgba(76,175,80,0.15); color: var(--success-green); }
    .alert-icon.warning { background: rgba(255,152,0,0.15); color: var(--warning-orange); }
    .alert-icon.error { background: rgba(255,68,68,0.15); color: var(--error-red); }
    .alert-icon.info { background: rgba(33,150,243,0.15); color: var(--info-blue); }
    .alert-icon svg { width: 18px; height: 18px; }
    .alert-body { flex: 1; min-width: 0; }
    .alert-title { font-size: 0.85rem; font-weight: 700; color: var(--text-light); margin-bottom: 3px; }
    .alert-message { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }
    .alert-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; display: flex; align-items: center; gap: 10px; }
    .alert-audience { font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .audience-all { background: rgba(33,150,243,0.15); color: var(--info-blue); }
    .audience-user { background: rgba(76,175,80,0.15); color: var(--success-green); }
    .delete-alert-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 5px; flex-shrink: 0;
      transition: var(--transition-smooth);
    }
    .delete-alert-btn:hover { color: var(--error-red); }
    .delete-alert-btn svg { width: 16px; height: 16px; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--surface); border-radius: var(--radius-large); padding: 25px; max-width: 450px; width: 100%; border: 1px solid var(--border-light); animation: modalIn 0.3s; text-align: center; max-height: 80vh; overflow-y: auto; }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .modal-icon { width: 55px; height: 55px; margin: 0 auto 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .modal-icon.warning { background: rgba(255,152,0,0.15); color: var(--warning-orange); }
    .modal-icon.danger { background: rgba(255,68,68,0.15); color: var(--error-red); }
    .modal-icon.success { background: rgba(76,175,80,0.15); color: var(--success-green); }
    .modal-icon svg { width: 26px; height: 26px; }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 10px; }
    .modal-message { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-btn { flex: 1; padding: 11px; border: none; border-radius: var(--radius-small); cursor: pointer; font-family: inherit; font-size: 0.8rem; font-weight: 700; transition: var(--transition-smooth); }
    .modal-btn.confirm { background: var(--error-red); color: #fff; }
    .modal-btn.success-confirm { background: var(--success-green); color: #fff; }
    .modal-btn.cancel { background: var(--surface-light); color: var(--text-muted); }

    /* Form */
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .form-input { width: 100%; height: 42px; background: var(--bg-dark); border: 1px solid var(--border-light); border-radius: var(--radius-small); padding: 0 12px; font-family: inherit; font-size: 0.85rem; color: var(--text-light); outline: none; transition: var(--transition-smooth); }
    .form-input:focus { border-color: var(--gold); }
    .form-input::placeholder { color: rgba(255,255,255,0.3); }
    .form-textarea { width: 100%; min-height: 80px; background: var(--bg-dark); border: 1px solid var(--border-light); border-radius: var(--radius-small); padding: 10px 12px; font-family: inherit; font-size: 0.85rem; color: var(--text-light); outline: none; resize: vertical; transition: var(--transition-smooth); }
    .form-textarea:focus { border-color: var(--gold); }
    .form-select { width: 100%; height: 42px; background: var(--bg-dark); border: 1px solid var(--border-light); border-radius: var(--radius-small); padding: 0 12px; font-family: inherit; font-size: 0.85rem; color: var(--text-light); outline: none; cursor: pointer; }

    /* Toast */
    .toast-container { position: fixed; top: 70px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--surface); border-radius: var(--radius-medium); padding: 14px 18px; box-shadow: var(--shadow-medium); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: transform 0.5s; max-width: 340px; border-left: 4px solid var(--gold); }
    .toast.show { transform: translateX(0); }
    .toast.success { border-left-color: var(--success-green); }
    .toast.error { border-left-color: var(--error-red); }
    .toast-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast.success .toast-icon { background: rgba(76,175,80,0.15); color: var(--success-green); }
    .toast.error .toast-icon { background: rgba(255,68,68,0.15); color: var(--error-red); }
    .toast-icon svg { width: 16px; height: 16px; }
    .toast-content h4 { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
    .toast-content p { font-size: 0.75rem; color: var(--text-muted); }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
    .empty-state svg { width: 50px; height: 50px; margin-bottom: 15px; color: var(--border-light); }

    @media (max-width: 768px) { .stats-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon warning" id="modalIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
    <h3 class="modal-title" id="modalTitle">Confirm</h3>
    <p class="modal-message" id="modalMessage">Are you sure?</p>
    <div id="modalForm" style="display:none;"></div>
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn confirm" id="modalConfirmBtn" onclick="confirmModalAction()">Confirm</button>
    </div>
  </div>
</div>

<!-- Top Bar -->
<div class="top-bar">
  <div class="top-bar-left">
    <button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
    <div class="top-bar-title">Lumera Admin</div>
  </div>
  <button class="logout-btn" onclick="showLogoutConfirm()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Logout
  </button>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
  <ul class="sidebar-nav">
    <li><a href="admin-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a></li>
    <li><a href="admin-users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Users</a></li>
    <li><a href="admin-deposits.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Deposits</a></li>
    <li><a href="admin-withdrawals.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12h14"/></svg>Withdrawals</a></li>
    <li><a href="admin-investments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>Investments</a></li>
    <li><a href="admin-plans.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/></svg>Plans</a></li>
    <li><a href="admin-referrals.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Referrals</a></li>
    <li><a href="admin-transactions.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Transactions</a></li>
    <li><a href="admin-alerts.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>Alerts</a></li>
    <li><a href="admin-settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a></li>
  </ul>
</div>

<!-- Main Content -->
<div class="main-content">
  <div class="page-header">
    <div>
      <h1 class="page-title">Alert Management</h1>
      <p class="page-subtitle">Send and manage notifications to users</p>
    </div>
    <button class="new-alert-btn" onclick="showNewAlertModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New Alert
    </button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-mini"><div class="stat-mini-value total" id="totalAlerts">0</div><div class="stat-mini-label">Total Alerts</div></div>
    <div class="stat-mini"><div class="stat-mini-value broadcast" id="broadcastCount">0</div><div class="stat-mini-label">Broadcast</div></div>
    <div class="stat-mini"><div class="stat-mini-value user" id="userAlertsCount">0</div><div class="stat-mini-label">User Specific</div></div>
  </div>

  <!-- Alerts List -->
  <div class="alerts-list" id="alertsList">
    <div class="empty-state">Loading alerts...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNxT46nSRdtD2cKmlqZ8ihx4Tk3QZ7Iuk",
    authDomain: "lumera-81730.firebaseapp.com",
    projectId: "lumera-81730",
    storageBucket: "lumera-81730.firebasestorage.app",
    messagingSenderId: "175198576882",
    appId: "1:175198576882:web:00367daecf932b821eb06b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let modalAction = null;
  let allAlerts = [];

  function showToast(type, title, message) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <div class="toast-icon">${type === 'success' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'}</div>
      <div class="toast-content"><h4>${title}</h4><p>${message}</p></div>
    `;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 4000);
  }

  function showModal(title, message, action, type) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    modalAction = action;
    const icon = document.getElementById('modalIcon');
    const confirmBtn = document.getElementById('modalConfirmBtn');
    const formEl = document.getElementById('modalForm');
    formEl.style.display = 'none';
    confirmBtn.style.display = 'block';
    
    const types = {
      danger: { iconClass: 'danger', btnClass: 'confirm', iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' },
      success: { iconClass: 'success', btnClass: 'success-confirm', iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>' },
      warning: { iconClass: 'warning', btnClass: 'confirm', iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' }
    };
    
    const t = types[type] || types.warning;
    icon.className = `modal-icon ${t.iconClass}`;
    icon.innerHTML = t.iconSvg;
    confirmBtn.className = `modal-btn ${t.btnClass}`;
    confirmBtn.textContent = 'Confirm';
    
    document.getElementById('modalOverlay').classList.add('show');
  }

  window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('show'); modalAction = null; };
  window.confirmModalAction = function() { if (modalAction) modalAction(); closeModal(); };

  window.toggleSidebar = function() {
    document.getElementById('sidebar').classList.toggle('show');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  };

  window.showLogoutConfirm = function() {
    showModal('Logout', 'Are you sure you want to log out?', async () => {
      await signOut(auth);
      window.location.href = 'admin-login.html';
    }, 'warning');
  };

  // ===== NEW ALERT MODAL =====
  window.showNewAlertModal = function() {
    document.getElementById('modalTitle').textContent = 'Create New Alert';
    document.getElementById('modalMessage').textContent = 'Compose your notification.';
    document.getElementById('modalIcon').className = 'modal-icon success';
    document.getElementById('modalIcon').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>';
    document.getElementById('modalConfirmBtn').className = 'modal-btn success-confirm';
    document.getElementById('modalConfirmBtn').textContent = 'Send Alert';
    
    const formEl = document.getElementById('modalForm');
    formEl.style.display = 'block';
    formEl.innerHTML = `
      <div class="form-group">
        <label class="form-label">Alert Type</label>
        <select class="form-select" id="alertType">
          <option value="info">Info</option>
          <option value="success">Success</option>
          <option value="warning">Warning</option>
          <option value="error">Error</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Audience</label>
        <select class="form-select" id="alertAudience">
          <option value="all">All Users (Broadcast)</option>
          <option value="user">Specific User</option>
        </select>
      </div>
      <div class="form-group" id="userEmailGroup" style="display:none;">
        <label class="form-label">User Email</label>
        <input type="email" class="form-input" id="alertUserEmail" placeholder="user@email.com" />
      </div>
      <div class="form-group">
        <label class="form-label">Alert Title</label>
        <input type="text" class="form-input" id="alertTitle" placeholder="Alert title" />
      </div>
      <div class="form-group">
        <label class="form-label">Alert Message</label>
        <textarea class="form-textarea" id="alertMessage" placeholder="Type your message here..."></textarea>
      </div>
    `;
    
    // Toggle user email field
    document.getElementById('alertAudience').addEventListener('change', function() {
      document.getElementById('userEmailGroup').style.display = this.value === 'user' ? 'block' : 'none';
    });
    
    modalAction = sendAlert;
    document.getElementById('modalOverlay').classList.add('show');
  };

  // ===== SEND ALERT =====
  async function sendAlert() {
    const type = document.getElementById('alertType').value;
    const audience = document.getElementById('alertAudience').value;
    const title = document.getElementById('alertTitle').value.trim();
    const message = document.getElementById('alertMessage').value.trim();
    
    if (!title || !message) {
      showToast('error', 'Missing Fields', 'Please enter both title and message.');
      return;
    }
    
    try {
      let targetUid = null;
      let userEmail = null;
      
      if (audience === 'user') {
        userEmail = document.getElementById('alertUserEmail').value.trim();
        if (!userEmail) {
          showToast('error', 'Missing Email', 'Please enter user email.');
          return;
        }
        
        // Find user by email
        const usersSnapshot = await getDocs(collection(db, 'users'));
        let found = false;
        usersSnapshot.forEach(doc => {
          const u = doc.data();
          if (u.email === userEmail) {
            targetUid = u.uid;
            found = true;
          }
        });
        
        if (!found) {
          showToast('error', 'User Not Found', 'No user found with this email.');
          return;
        }
      }
      
      const alertId = 'alert_' + Date.now();
      await setDoc(doc(db, 'alerts', alertId), {
        id: alertId,
        type: type,
        title: title,
        message: message,
        uid: targetUid || 'all',
        audience: audience,
        read: false,
        createdAt: new Date().toISOString()
      });
      
      showToast('success', 'Alert Sent', audience === 'all' ? 'Broadcast alert sent to all users.' : `Alert sent to ${userEmail}.`);
      loadAlerts();
    } catch (error) {
      showToast('error', 'Error', 'Failed to send alert.');
    }
  }

  // ===== DELETE ALERT =====
  window.deleteAlert = function(alertId) {
    showModal('Delete Alert', 'Are you sure you want to delete this alert?', async () => {
      try {
        await deleteDoc(doc(db, 'alerts', alertId));
        showToast('success', 'Alert Deleted', 'Alert has been removed.');
        loadAlerts();
      } catch (error) {
        showToast('error', 'Error', 'Failed to delete alert.');
      }
    }, 'danger');
  };

  // ===== RENDER ALERTS =====
  function renderAlerts() {
    const list = document.getElementById('alertsList');
    
    document.getElementById('totalAlerts').textContent = allAlerts.length;
    document.getElementById('broadcastCount').textContent = allAlerts.filter(a => a.audience === 'all').length;
    document.getElementById('userAlertsCount').textContent = allAlerts.filter(a => a.audience === 'user').length;
    
    if (allAlerts.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <p>No alerts sent yet. Click "New Alert" to create one.</p>
        </div>
      `;
      return;
    }
    
    const icons = {
      success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
      warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };
    
    list.innerHTML = allAlerts.map(alert => `
      <div class="alert-card">
        <div class="alert-icon ${alert.type}">${icons[alert.type]}</div>
        <div class="alert-body">
          <div class="alert-title">${alert.title}</div>
          <div class="alert-message">${alert.message}</div>
          <div class="alert-meta">
            <span class="alert-audience ${alert.audience === 'all' ? 'audience-all' : 'audience-user'}">${alert.audience === 'all' ? 'Broadcast' : 'User Specific'}</span>
            <span>${new Date(alert.createdAt).toLocaleString()}</span>
          </div>
        </div>
        <button class="delete-alert-btn" onclick="deleteAlert('${alert.id}')" title="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
      </div>
    `).join('');
  }

  // ===== LOAD ALERTS =====
  async function loadAlerts() {
    try {
      const snapshot = await getDocs(collection(db, 'alerts'));
      allAlerts = [];
      snapshot.forEach(doc => allAlerts.push(doc.data()));
      
      allAlerts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      renderAlerts();
    } catch (error) {
      console.error('Error loading alerts:', error);
      document.getElementById('alertsList').innerHTML = '<div class="empty-state">Error loading alerts. Collection may not exist yet.</div>';
    }
  }

  // ===== AUTH CHECK =====
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (userDoc.exists() && userDoc.data().isAdmin === true) {
        loadAlerts();
      } else {
        window.location.href = 'admin-login.html';
      }
    } else {
      window.location.href = 'admin-login.html';
    }
  });
</script>
